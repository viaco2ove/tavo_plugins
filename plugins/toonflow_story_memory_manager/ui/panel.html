<style>
#tmm-panel{position:fixed;width:240px;background:var(--bg-secondary,#2a2a2a);border:1px solid var(--border-color,#444);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:1000;font-family:system-ui,sans-serif;font-size:12px;color:var(--text-primary,#e0e0e0)}
#tmm-panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-tertiary,#333);border-bottom:1px solid var(--border-color,#444);cursor:move;user-select:none}
#tmm-panel-title{font-weight:600}
#tmm-panel-content{padding:10px 12px}
#tmm-panel-empty{text-align:center;color:var(--text-muted,#888);padding:20px 0}
.tmm-section{margin-bottom:10px}
.tmm-label{font-weight:600;color:var(--accent-color,#7cb3ff);font-size:11px;text-transform:uppercase}
.tmm-content{font-size:12px;line-height:1.5;word-break:break-word}
.tmm-tags{display:flex;flex-wrap:wrap;gap:4px}
.tmm-tag{background:rgba(124,179,255,.2);color:#7cb3ff;padding:2px 8px;border-radius:10px;font-size:11px}
#tmm-panel-footer{padding:6px 12px;border-top:1px solid var(--border-color,#444);display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted,#666)}
#tmm-refresh-btn{background:rgba(124,179,255,.2);border:1px solid #7cb3ff;color:#7cb3ff;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:11px}
#tmm-refresh-btn:hover{background:#7cb3ff;color:#1a1a1a}
</style>
<div id="tmm-panel">
<div id="tmm-panel-header"><span id="tmm-panel-title">记忆</span></div>
<div id="tmm-panel-content">
<div id="tmm-panel-empty">暂无记忆</div>
<div id="tmm-panel-body" style="display:none">
<div class="tmm-section"><div class="tmm-label">摘要</div><div class="tmm-content" id="tmm-summary"></div></div>
<div class="tmm-section" id="tmm-facts-section"><div class="tmm-label">事实</div><div class="tmm-content" id="tmm-facts"></div></div>
<div class="tmm-section" id="tmm-tags-section"><div class="tmm-label">标签</div><div class="tmm-tags" id="tmm-tags"></div></div>
</div>
</div>
<div id="tmm-panel-footer"><span id="tmm-turns"></span><button id="tmm-refresh-btn">刷新</button></div>
</div>
<script>
(function(){
const NS='tmm';
function update(){
let s=null;try{s=window.tavo.get(NS)}catch(e){}
document.getElementById('tmm-panel-empty').style.display=s&&s.summary?'none':'block';
document.getElementById('tmm-panel-body').style.display=s&&s.summary?'block':'none';
if(s&&s.summary){
document.getElementById('tmm-summary').textContent=s.summary;
document.getElementById('tmm-facts').textContent=(s.facts||[]).join('; ');
document.getElementById('tmm-tags').innerHTML=(s.tags||[]).map(t=>'<span class="tmm-tag">'+t+'</span>').join('');
document.getElementById('tmm-turns').textContent='已对话'+(s.turnsSinceRefresh||0)+'轮';
}}
document.getElementById('tmm-refresh-btn').onclick=function(){window.tavo.plugin.emit('sidebar:action','tmm-refresh')};
update();setInterval(update,3000);
var isDrag=false,startX,startY,startR,startB;
document.getElementById('tmm-panel-header').onmousedown=function(e){isDrag=true;startX=e.clientX;startY=e.clientY;var p=window.tavo.get(NS+'.pos')||{right:20,bottom:50};startR=p.right||20;startB=p.bottom||50};
document.addEventListener('mousemove',function(e){if(!isDrag)return;var panel=document.getElementById('tmm-panel');panel.style.right=(startR+(startX-e.clientX))+'px';panel.style.bottom=(startB+(startY-e.clientY))+'px'});
document.addEventListener('mouseup',function(){if(!isDrag)return;isDrag=false;var panel=document.getElementById('tmm-panel');var rect=panel.getBoundingClientRect();window.tavo.update(NS+'.pos',{right:window.innerWidth-rect.right,bottom:window.innerHeight-rect.bottom},'chat')});
})();
</script>
