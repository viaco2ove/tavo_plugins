<!-- toonflow_story_sprite_background - 前景立绘层（背景走 tavo.chat.update background API） -->
<style>
#tf-sprite-fg-wrap {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  z-index: -1;
  pointer-events: none;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}
.tf-sprite-fg {
  display: block;
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  height: 100%;
  width: auto;
  max-width: none;
  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.35));
  transition: opacity 0.4s ease;
}
.tf-sprite-fg.hidden { opacity: 0; }
</style>

<div id="tf-sprite-fg-wrap">
  <img id="tf-sprite-fg" class="tf-sprite-fg" src="cover.jpg" alt="sprite" />
</div>

<script>
(function(){
  console.log('[sprite_background][sprite-html] sprite_layer.html loaded');
  setTimeout(function(){
    var wrap = document.getElementById('tf-sprite-fg-wrap');
    var img = document.getElementById('tf-sprite-fg');
    console.log('[sprite_background][sprite-html] DOM check: wrap=' + !!wrap + ' img=' + !!img + ' wrap.style=' + (wrap ? wrap.style.cssText : 'N/A'));
    if (wrap) {
      try {
        wrap.style.zIndex = -1;
        wrap.style.width = tavo.plugin.config.get('fgWidth') || '100vw';
        if (img) {
          img.style.bottom = tavo.plugin.config.get('fgBottom') || '0px';
          img.style.height = tavo.plugin.config.get('fgHeight') || '100vh';
        }
        console.log('[sprite_background][sprite-html] wrap styles applied, zIndex=' + wrap.style.zIndex + ' bottom=' + (img ? img.style.bottom : 'N/A'));
      } catch(e) { console.warn('[sprite_background][sprite-html] config error', e); }
    }
  }, 100);
})();
</script>
