<!-- toonflow_story_sprite_background - 前景立绘层（背景走 tavo.chat.update background API） -->
<style>
#tf-sprite-fg-wrap {
  position: fixed;
  left: 50%;
  bottom: 80px;
  transform: translateX(-50%);
  z-index: 1;
  pointer-events: none;
  width: min(80vw, 600px);
  height: min(70vh, 700px);
}
.tf-sprite-fg {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 10px 30px rgba(0,0,0,0.35));
  transition: opacity 0.4s ease;
}
.tf-sprite-fg.hidden { opacity: 0; }
</style>

<div id="tf-sprite-fg-wrap">
  <img id="tf-sprite-fg" class="tf-sprite-fg" src="" alt="sprite" />
</div>

<script>
(function(){
  setTimeout(function(){
    try {
      var wrap = document.getElementById('tf-sprite-fg-wrap');
      if (wrap) {
        wrap.style.bottom = tavo.plugin.config.get('fgBottom') || '80px';
        wrap.style.width = tavo.plugin.config.get('fgWidth') || 'min(80vw, 600px)';
        wrap.style.height = tavo.plugin.config.get('fgHeight') || 'min(70vh, 700px)';
      }
    } catch(e) {}
  }, 100);
})();
</script>
