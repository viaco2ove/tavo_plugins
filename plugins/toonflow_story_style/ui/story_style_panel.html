<!-- toonflow_story_style - 气泡样式面板 -->
<!-- 单条/多条显示(由 entry.js 的 message:added 驱动) + 透明度(纯 CSS 选择器 + 变量控制，不扫 DOM 不改主题) -->
<style>
#tf-style-tab {
  position: fixed; top: 8px; right: 8px; z-index: 9990; margin: 0; padding: 9px 14px;
  background: var(--bg-tertiary, rgba(40,40,40,0.82));
  border: 1px solid var(--border-color, #333); border-radius: 10px; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px; font-size: 13px;
  color: var(--text-primary, #e8e8e8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-sizing: border-box; transition: border-color 0.15s ease, transform 0.1s ease;
}
#tf-style-tab:hover { border-color: var(--accent-color, #7cb3ff); }
#tf-style-tab:active { transform: scale(0.985); }
.tf-style-tab-name { flex: 1; font-weight: 500; }
.tf-style-chevron { color: var(--accent-warm, #ff9966); font-size: 18px; font-weight: 700; line-height: 1; }

#tf-style-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.62); z-index: 10000;
  display: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
#tf-style-overlay.open { display: block; }
.tf-style-modal {
  background: var(--bg-secondary, #1f1f23); color: var(--text-primary, #e8e8e8);
  border-radius: 14px; width: min(560px, 92vw); margin: 28px auto;
  box-shadow: 0 16px 56px rgba(0,0,0,0.55);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden; box-sizing: border-box;
}
.tf-style-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 1px solid var(--border-color, #2a2a30);
  position: sticky; top: 0; background: var(--bg-secondary, #1f1f23); z-index: 1;
}
.tf-style-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.tf-style-close {
  background: var(--bg-quaternary, #333); border: 1px solid var(--border-color, #444);
  color: var(--text-secondary, #bbb); border-radius: 8px; padding: 5px 14px; font-size: 12px; cursor: pointer;
}
.tf-style-close:hover { color: var(--accent-color, #7cb3ff); border-color: var(--accent-color, #7cb3ff); }
.tf-style-body { padding: 18px 20px 24px; }

.tf-row { margin-bottom: 20px; }
.tf-row-label { font-size: 13px; color: var(--text-secondary, #bbb); font-weight: 600; margin-bottom: 10px; }
.tf-seg { display: flex; gap: 10px; }
.tf-seg button {
  flex: 1; padding: 10px; border-radius: 9px; cursor: pointer; font-size: 13px;
  background: var(--bg-tertiary, #26262c); border: 1px solid var(--border-color, #303036);
  color: var(--text-secondary, #ccc);
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.tf-seg button.active {
  border-color: var(--accent-color, #7cb3ff);
  color: var(--text-primary, #fff);
  background: rgba(124,179,255,0.12);
}

.tf-slider-wrap { display: flex; align-items: center; gap: 12px; }
.tf-slider-wrap input[type=range] { flex: 1; accent-color: var(--accent-color, #7cb3ff); cursor: pointer; }
.tf-slider-val { width: 48px; text-align: right; font-size: 13px; color: var(--text-primary, #e8e8e8); font-variant-numeric: tabular-nums; }

.tf-hint { font-size: 12px; color: var(--text-muted, #888); line-height: 1.65; margin-top: 12px; }
.tf-status { font-size: 12px; color: var(--accent-color, #9ec5ff); min-height: 18px; margin-top: 10px; }
</style>

<div id="tf-style-tab">
  <span class="tf-style-tab-name">气泡样式</span>
  <span class="tf-style-chevron">›</span>
</div>

<div id="tf-style-overlay">
  <div class="tf-style-modal">
    <div class="tf-style-head">
      <h2>气泡样式</h2>
      <button class="tf-style-close" id="tf-style-close">关闭</button>
    </div>
    <div class="tf-style-body">

      <div class="tf-row">
        <div class="tf-row-label">显示模式</div>
        <div class="tf-seg">
          <button id="tf-mode-single">单条（仅最新台词）</button>
          <button id="tf-mode-multi">多条（显示全部）</button>
        </div>
      </div>

      <div class="tf-row">
        <div class="tf-row-label">气泡透明度</div>
        <div class="tf-slider-wrap">
          <input type="range" id="tf-opacity" min="0" max="100" value="100">
          <span class="tf-slider-val" id="tf-opacity-val">100%</span>
        </div>
      </div>

      <div class="tf-hint">
        透明度通过 CSS 变量控制 <code>.tav-user-bubble</code> / <code>.tav-character-bubble</code>；单条/多条通过 <code>body.tf-style-single</code> 切换，<b>不调任何 message API</b>，零弹框、零数据污染。<br>
        「单条」隐藏历史气泡（仅显示最新一条），「多条」全部显示。
      </div>
      <div class="tf-status" id="tf-style-status"></div>

    </div>
  </div>
</div>

<script>
(function () {
  var NS = 'tf_style';
  var T = (typeof tavo !== 'undefined') ? tavo : (window.tavo || null);

  function pin(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var prev = window['__pin_' + id];
    if (prev && prev !== el && prev.parentNode) prev.parentNode.removeChild(prev);
    if (el.parentNode !== document.body) document.body.appendChild(el);
    window['__pin_' + id] = el;
    return el;
  }
  pin('tf-style-tab');
  pin('tf-style-overlay');

  var _mode = 'multi';
  var _opacity = 100;          // 0-100，100=完全不透明

  // T.get 返回包装对象 {target,name,found,value}，真实值在 .value；不解包会导致
  // mode 永远判定为 multi、opacity 永远 parseInt 失败回落 100（面板读不回已保存设置）。
  function readChatVar(name) {
    try {
      var v = T.get(name);
      var guard = 0;
      while (v && typeof v === 'object' && v.found !== undefined && ('value' in v) && guard < 5) {
        v = v.value; guard++;
      }
      return v;
    } catch (e) { return null; }
  }

  function readMode() {
    try { var v = readChatVar(NS + '.mode'); return v === 'single' ? 'single' : 'multi'; }
    catch (e) { return 'multi'; }
  }
  function readOpacity() {
    try { var v = parseInt(readChatVar(NS + '.opacity'), 10); return isNaN(v) ? 100 : v; }
    catch (e) { return 100; }
  }

  /* =====================================================================
   * 透明度：纯 CSS 选择器 + 变量控制
   * - 永久注入一条 CSS，命中 .tav-user-bubble / .tav-character-bubble
   * - 拖滑块只改 --tf-bubble-alpha 一个变量（零 DOM 扫描、零 API）
   * - 新气泡自动命中，无需 message:changed 重扫
   * - 主题色变化时重读一次写 RGB 变量（chat:opened 触发）
   * - flat 风格气泡保持透明（CSS 特异性，不参与透明度控制）
   * ===================================================================== */

  var INJECT_ID = 'tf-bubble-style-inject';
  // 默认色取自 tavo bundle.min.css（user #c3f2fd / character #f5f5f5）
  var DEFAULT_USER_RGB = [195, 242, 253];
  var DEFAULT_CHAR_RGB = [245, 245, 245];

  // 解析 8 位 #AARRGGBB 或 6 位 #RRGGBB -> [r,g,b]
  function parseHex(h) {
    h = (h || '').replace('#', '');
    if (h.length === 8) h = h.slice(2);   // 去 AA
    if (h.length !== 6) return null;
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }

  // 一次性注入永久 CSS
  // - 透明度：选择器 + :root 变量（拖滑块只改 --tf-bubble-alpha）
  // - 单条模式：body.tf-style-single + CSS 选择器直接隐藏 .kuibao-list-item，仅显示第一条
  // - flat 风格特异性保护：保持透明
  function injectBubbleCSS() {
    if (document.getElementById(INJECT_ID)) return;
    var css = [
      ':root{',
        '--tf-user-r:', DEFAULT_USER_RGB[0], ';--tf-user-g:', DEFAULT_USER_RGB[1], ';--tf-user-b:', DEFAULT_USER_RGB[2], ';',
        '--tf-char-r:', DEFAULT_CHAR_RGB[0], ';--tf-char-g:', DEFAULT_CHAR_RGB[1], ';--tf-char-b:', DEFAULT_CHAR_RGB[2], ';',
        '--tf-bubble-alpha:1;',
      '}',
      '.tav-user-bubble{background-color:rgba(var(--tf-user-r),var(--tf-user-g),var(--tf-user-b),var(--tf-bubble-alpha))!important}',
      '.tav-character-bubble{background-color:rgba(var(--tf-char-r),var(--tf-char-g),var(--tf-char-b),var(--tf-bubble-alpha))!important}',
      // flat 风格气泡本应透明：特异性 0,2,0,0 > 0,1,0,0，覆盖上面的 alpha 控制
      '.tav-bubble-style-flat .tav-user-bubble,',
      '.tav-bubble-style-flat .tav-character-bubble{background-color:transparent!important}',
      // 单条模式：纯 CSS 控制，隐藏 .kuibao-list-item，仅显示第一条（最新台词）
      'body.tf-style-single .kuibao-list-item{display:none!important}',
      'body.tf-style-single .kuibao-list-item:first-child{display:block!important}',
    ].join('');
    var tag = document.createElement('style');
    tag.id = INJECT_ID;
    tag.textContent = css;
    (document.head || document.documentElement).appendChild(tag);
  }

  function setRGBVars(rk, gk, bk, rgb) {
    var root = document.documentElement.style;
    root.setProperty(rk, rgb[0]);
    root.setProperty(gk, rgb[1]);
    root.setProperty(bk, rgb[2]);
  }

  // 从主题读气泡色，更新 RGB 变量（不重注入 CSS，只改变量值）
  async function loadThemeColors() {
    try {
      var chat = await T.chat.current();
      var tid = chat && chat.theme && (chat.theme.id != null ? chat.theme.id : chat.theme);
      var th = tid ? await T.theme.get(tid) : null;
      if (!th) return;
      if (th.userBubble && th.userBubble.color) {
        var u = parseHex(th.userBubble.color);
        if (u) setRGBVars('--tf-user-r', '--tf-user-g', '--tf-user-b', u);
      }
      if (th.characterBubble && th.characterBubble.color) {
        var c = parseHex(th.characterBubble.color);
        if (c) setRGBVars('--tf-char-r', '--tf-char-g', '--tf-char-b', c);
      }
    } catch (e) {}
  }

  // 只改 alpha 变量 —— 零 DOM 扫描、零 API 调用
  function applyOpacity(pct) {
    _opacity = pct;
    var alpha = Math.max(0, Math.min(100, pct)) / 100;
    document.documentElement.style.setProperty('--tf-bubble-alpha', alpha);
    var v = document.getElementById('tf-opacity-val');
    if (v) v.textContent = pct + '%';
  }

  /* ===== 单条/多条：纯 CSS class 切换（零 API、零弹框） ===== */
  // 单条模式可见性完全由 injectBubbleCSS() 注入的 CSS 控制：
  //   body.tf-style-single .kuibao-list-item{display:none!important}
  //   body.tf-style-single .kuibao-list-item:first-child{display:block!important}
  // 最新一条 = 列表第一条（:first-child），无需 JS 标记、无需 message API。

  async function applyMode(mode) {
    _mode = mode;
    try { T.set(NS + '.mode', mode, 'chat'); } catch (e) {}
    var inSingle = mode === 'single';
    document.body.classList.toggle('tf-style-single', inSingle);
    syncUI();
  }

  function syncUI() {
    var s = document.getElementById('tf-mode-single');
    var m = document.getElementById('tf-mode-multi');
    if (s) s.classList.toggle('active', _mode === 'single');
    if (m) m.classList.toggle('active', _mode === 'multi');
  }

  /* ===== 初始化 ===== */
  _mode = readMode();
  _opacity = readOpacity();
  syncUI();

  // 1) 一次性注入永久 CSS（选择器 + 变量骨架）
  injectBubbleCSS();
  // 2) 异步读主题色填充 RGB 变量（失败则用默认色，alpha 仍可控）
  loadThemeColors();
  // 3) 应用当前 mode：toggle body class（不调任何 API）
  document.body.classList.toggle('tf-style-single', _mode === 'single');
  // 4) 应用当前 opacity（只改 alpha 变量）
  applyOpacity(_opacity);

  var slider = document.getElementById('tf-opacity');
  var sliderVal = document.getElementById('tf-opacity-val');
  if (slider) {
    slider.value = _opacity;
    if (sliderVal) sliderVal.textContent = _opacity + '%';
    // 拖动实时改变量（零 API、零 DOM 扫描）
    slider.addEventListener('input', function () {
      var pct = parseInt(slider.value, 10);
      applyOpacity(pct);
    });
    // 松手才存变量（持久化）
    slider.addEventListener('change', function () {
      try { T.set(NS + '.opacity', _opacity, 'chat'); } catch (e) {}
    });
  }

  /* ===== 事件 ===== */
  var tab = document.getElementById('tf-style-tab');
  var overlay = document.getElementById('tf-style-overlay');
  var closeBtn = document.getElementById('tf-style-close');
  if (tab) tab.addEventListener('click', function () { overlay && overlay.classList.add('open'); });
  if (overlay) overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.classList.remove('open'); });
  if (closeBtn) closeBtn.addEventListener('click', function () { overlay && overlay.classList.remove('open'); });
  var bs = document.getElementById('tf-mode-single'); if (bs) bs.addEventListener('click', function () { applyMode('single'); });
  var bm = document.getElementById('tf-mode-multi'); if (bm) bm.addEventListener('click', function () { applyMode('multi'); });

  // chat 切换时重读主题色（单条模式可见性由 CSS 自动处理，无需重打标记）
  if (T && T.plugin && T.plugin.on) {
    try { T.plugin.on('chat:opened', function () { loadThemeColors(); }); } catch (e) {}
  }
})();
</script>
