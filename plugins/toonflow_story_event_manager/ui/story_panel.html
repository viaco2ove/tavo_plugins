            async function renderSheet() {
                var titleEl = document.getElementById('tf-head-title');
                var subEl = document.getElementById('tf-head-sub');
                var tabName = document.getElementById('tf-tab-name');
                _story = await buildStory();
                if (!_story) return;
                if (titleEl) titleEl.textContent = _story.name;
                if (tabName) tabName.textContent = _story.name;
                // 副标题：故事简介
                var wbE = (_story.worldbook.entries || []).find(function (e) {
                    return /【简介】/.test(e.content || '');
                });
                if (subEl) subEl.textContent = '故事简介：' + (wbE ? (wbE.content || '').replace('【简介】', '').trim().slice(0, 60) : '暂无简介');
                try {
                    _avatars = await Promise.all(_story.characters.map(function (c) {
                        return resolveAvatarUrl(c.avatar);
                    }));
                } catch (e) {
                    _avatars = [];
                }
                await loadEdit();
                renderBody();
            }

            function openSheet() {
                var o = document.getElementById('tf-story-overlay');
                if (o) {
                    o.classList.add('open');
                    // 确保 tmm_story 展示层包含最新的动态数据（hp/mp/level 等）
                    // 读取 tmm 中的动态补丁，同步合并到 tmm_story
                    try {
                        var tmm = readChatVar('tmm') || {};
                        var storyStatic = readChatVar(tmmNs('story')) || readChatVar(tmmNs('story_static')) || {characters: []};
                        var cards = storyStatic.characters || [];
                        var playerPatch = (tmm.cards && tmm.cards.player) || {};
                        var npcPatches = (tmm.cards && tmm.cards.npcs) || {};
                        if (Object.keys(playerPatch).length || Object.keys(npcPatches).length) {
                            cards = cards.map(function (ch) {
                                if (ch.roleType === 'player' && Object.keys(playerPatch).length) {
                                    return Object.assign({}, ch, {card: Object.assign({}, ch.card || {}, playerPatch)});
                                }
                                if (npcPatches[ch.name] && Object.keys(npcPatches[ch.name]).length) {
                                    return Object.assign({}, ch, {card: Object.assign({}, ch.card || {}, npcPatches[ch.name])});
                                }
                                return ch;
                            });
                            // 用同步后的数据覆盖 tmm_story（下次打开时也正确）
                            T.set(tmmNs('story'), {name: storyStatic.name || '故事', characters: cards}, 'chat');
                        }
                    } catch (e) { /* ignore */
                    }
                    renderSheet();
                }
            }

            function closeSheet() {
                var o = document.getElementById('tf-story-overlay');
                if (o) o.classList.remove('open');
            }

            var tab = document.getElementById('tf-story-tab');
            var overlay = document.getElementById('tf-story-overlay');
            var closeBtn = document.getElementById('tf-sheet-close');
            if (tab) tab.addEventListener('click', openSheet);
            if (overlay) overlay.addEventListener('click', function (e) {
                if (e.target === overlay) closeSheet();
            });
            if (closeBtn) closeBtn.addEventListener('click', closeSheet);

            // 初始化 tab 名
            (async function () {
                try {
                    if (T && T.chat) {
                        var c = await T.chat.current();
                        var tabName = document.getElementById('tf-tab-name');
                        if (c && c.name && tabName) tabName.textContent = c.name;
                    }
                } catch (e) {
                }
            })();
        })
        ();

        // 角色配置弹窗
        (function () {
            var overlay = document.getElementById('tf-role-config-overlay');
            var charId = null;
            var charName = '';
            var pendingSpritePath = null; // tavo.file.import 返回的路径
            var pendingVoicePath = null;

            function readVar(name) {
                try {
                    var v = tavo.get(name, 'chat');
                    var guard = 0;
                    while (v && typeof v === 'object' && v.found !== undefined && 'value' in v && guard < 5) {
                        v = v.value;
                        guard++;
                    }
                    return v;
                } catch (e) {
                    return null;
                }
            }

            function openRoleConfig(id, name) {
                charId = id;
                charName = name;
                pendingSpritePath = null;
                pendingVoicePath = null;

                var info = document.getElementById('tf-config-char-info');
                var voiceStatus = document.getElementById('tf-config-voice-status');
                var spriteStatus = document.getElementById('tf-config-sprite-status');
                var preview = document.getElementById('tf-config-sprite-preview');
                var voicePlayer = document.getElementById('tf-config-voice-player');
                if (info) info.textContent = '角色: ' + name + ' (ID: ' + id + ')';

                try {
                    // 音色：{ "75": "files/chat/voice_75.wav" }
                    var vfAll = readVar('tf_voice_files') || {};
                    var voicePath = (typeof vfAll === 'object') ? (vfAll[String(id)] || '') : '';
                    if (voicePath) {
                        if (voiceStatus) voiceStatus.textContent = '已绑定: ' + voicePath;
                        if (voicePlayer) {
                            voicePlayer.controls = true;
                            try {
                                var vname = voicePath.split('/').pop();
                                voicePlayer.src = tavo.file.url(vname, 'chat') || '';
                            } catch (e) {
                                voicePlayer.src = '';
                            }
                        }
                    } else {
                        if (voiceStatus) voiceStatus.textContent = '未绑定音色文件';
                        if (voicePlayer) voicePlayer.src = '';
                    }
                    // 立绘：{ byName: { "红缥缈": { fg, bg, id } } }
                    var sp = readVar('tf_sprites') || {};
                    var spe = (sp.byName || {})[name];
                    if (spe && spe.fg) {
                        if (spriteStatus) spriteStatus.textContent = '已绑定: ' + spe.fg;
                        if (preview) {
                            try {
                                preview.src = tavo.file.url(spe.fg.split('/').pop(), 'chat') || '';
                            } catch (e) {
                                preview.src = '';
                            }
                        }
                    } else {
                        if (spriteStatus) spriteStatus.textContent = '未绑定立绘';
                        if (preview) preview.src = '';
                    }
                } catch (e) {
                    console.warn('[role-config] open err', e);
                }
                if (overlay) overlay.style.display = 'flex';
            }

            function closeRoleConfig() {
                if (overlay) overlay.style.display = 'none';
            }

            // 立绘选择：用 tavo.file.import（系统文件选择器，可靠）
            var spriteBtn = document.getElementById('tf-config-sprite-btn');
            var voiceBtn = document.getElementById('tf-config-voice-btn');
            var spriteStatus = document.getElementById('tf-config-sprite-status');
            var voiceStatus = document.getElementById('tf-config-voice-status');
            var spritePreview = document.getElementById('tf-config-sprite-preview');

            if (spriteBtn) {
                spriteBtn.onclick = async function () {
                    try {
                        var files = await tavo.file.import({
                            multiple: false,
                            extensions: ['png', 'webp', 'jpg', 'jpeg']
                        });
                        if (files && files.length > 0) {
                            pendingSpritePath = files[0].path;
                            if (spriteStatus) spriteStatus.textContent = '已选: ' + files[0].originalName;
                            if (spritePreview) {
                                try {
                                    var du = await tavo.file.load(files[0].path, {encoding: 'dataUrl'});
                                    spritePreview.src = (typeof du === 'string') ? du : (du && du.content ? du.content : files[0].path);
                                } catch (e) {
                                    spritePreview.src = files[0].path;
                                }
                            }
                        }
                    } catch (e) {
                        console.warn('[role-config] sprite import err', e);
                        if (spriteStatus) spriteStatus.textContent = '选择失败';
                    }
                };
            }
            // 音色选择
            if (voiceBtn) {
                voiceBtn.onclick = async function () {
                    try {
                        var files = await tavo.file.import({multiple: false, extensions: ['wav', 'mp3']});
                        if (files && files.length > 0) {
                            pendingVoicePath = files[0].path;
                            if (voiceStatus) voiceStatus.textContent = '已选: ' + files[0].originalName;
                        }
                    } catch (e) {
                        console.warn('[role-config] voice import err', e);
                        if (voiceStatus) voiceStatus.textContent = '选择失败';
                    }
                };
            }

            // 保存配置
            window._tfSaveRoleConfig = async function () {
                if (!charId) return;
                var saveBtn = document.getElementById('tf-config-save');
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.textContent = '保存中...';
                }
                try {
                    var sp = readVar('tf_sprites') || {};
                    if (typeof sp !== 'object') sp = {};
                    if (!sp.byName) sp.byName = {};
                    var entry = sp.byName[charName] || {id: charId, name: charName, roleType: 'npc'};

                    // 1. 立绘：直接用 tavo.file.import 返回的路径写入 tf_sprites
                    if (pendingSpritePath) {
                        entry.fg = pendingSpritePath;
                        entry.id = charId;
                        sp.byName[charName] = entry;
                        tavo.set('tf_sprites', sp, 'chat');
                        try {
                            tavo.set('tf_sprites', sp, 'global');
                        } catch (e) {
                        }
                        console.log('[role-config] 立绘: ' + pendingSpritePath);
                    }
                    // 2. 音色：直接用返回的路径写入 tf_voice_files
                    if (pendingVoicePath) {
                        var vfAll = readVar('tf_voice_files') || {};
                        if (typeof vfAll !== 'object') vfAll = {};
                        vfAll[String(charId)] = pendingVoicePath;
                        tavo.set('tf_voice_files', vfAll, 'chat');
                        try {
                            tavo.set('tf_voice_files', vfAll, 'global');
                        } catch (e) {
                        }
                        // 作废 voiceId
                        if (window.tf_voice && window.tf_voice.invalidateVoiceId) {
                            window.tf_voice.invalidateVoiceId(charId);
                        }
                        console.log('[role-config] 音色: ' + pendingVoicePath);
                    }
                    closeRoleConfig();
                    tavo.utils.toast('保存成功');
                } catch (e) {
                    console.error('[role-config] save err', e);
                    alert('保存失败: ' + (e.message || e));
                } finally {
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.textContent = '保存配置';
                    }
                }
            };

            document.addEventListener('click', function (e) {
                var btn = e.target.closest('[data-role-config]');
                if (btn) {
                    e.stopPropagation();
                    openRoleConfig(btn.getAttribute('data-role-config') || '', btn.getAttribute('data-char-name') || '');
                }
                if (e.target === overlay) closeRoleConfig();
                var closeBtn = e.target.closest('[data-close-role]');
                if (closeBtn && overlay) {
                    e.stopPropagation();
                    closeRoleConfig();
                }
            });
        })();

        // LLM 配置弹窗
        (function () {
            var overlay = document.getElementById('tf-llm-config-overlay');

            function readVar(name) {
                try {
                    var v = tavo.get(name, 'global');
                    var guard = 0;
                    while (v && typeof v === 'object' && v.found !== undefined && 'value' in v && guard < 5) {
                        v = v.value;
                        guard++;
                    }
                    return v;
                } catch (e) {
                    return null;
                }
            }

            window._tfOpenLlmConfig = function () {
                console.log('[llm-config] open');
                var cfg = readVar('tf_llm') || {};
                document.getElementById('tf-llm-cfg-apikey').value = cfg.apiKey || '';
                document.getElementById('tf-llm-cfg-apiurl').value = cfg.apiUrl || '';
                document.getElementById('tf-llm-cfg-model').value = cfg.model || '';
                document.getElementById('tf-llm-cfg-effort').value = cfg.reasoningEffort || 'minimal';
                // voice 配置（来自 voice 插件的 tf_voice_config 变量）
                var voiceCfg = readVar('tf_voice_config') || {};
                var vpEl = document.getElementById('tf-voice-cfg-platform');
                var vkEl = document.getElementById('tf-voice-cfg-apikey');
                if (vpEl) vpEl.value = voiceCfg.voice_platform || 'xiaomimimo';
                if (vkEl) vkEl.value = voiceCfg.voice_platform_apikey || '';
                if (overlay) overlay.style.display = 'flex';
            };

            function close() {
                if (overlay) overlay.style.display = 'none';
            }

            var saveBtn = document.getElementById('tf-llm-cfg-save');
            if (saveBtn) {
                saveBtn.addEventListener('click', function () {
                    // LLM 配置 → tf_llm 变量
                    var old = readVar('tf_llm') || {};
                    var llmMerged = Object.assign({}, old, {
                        apiKey: document.getElementById('tf-llm-cfg-apikey').value.trim(),
                        apiUrl: document.getElementById('tf-llm-cfg-apiurl').value.trim(),
                        model: document.getElementById('tf-llm-cfg-model').value.trim(),
                        reasoningEffort: document.getElementById('tf-llm-cfg-effort').value,
                    });
                    try {
                        tavo.set('tf_llm', llmMerged);
                        try {
                            tavo.set('tf_llm', llmMerged, 'global');
                        } catch (e) {
                        }
                        console.log('[llm-config] tf_llm saved:', JSON.stringify(llmMerged));
                    } catch (e) {
                        console.warn('[llm-config] tf_llm save failed', e);
                    }

                    // 语音配置 → tf_voice_config 变量（voice 插件通过此变量中转）
                    var voiceOld = readVar('tf_voice_config') || {};
                    var voiceMerged = Object.assign({}, voiceOld, {
                        voice_platform: (document.getElementById('tf-voice-cfg-platform') || {}).value || 'xiaomimimo',
                        voice_platform_apikey: (document.getElementById('tf-voice-cfg-apikey') || {}).value || '',
                    });
                    try {
                        tavo.set('tf_voice_config', voiceMerged);
                        try {
                            tavo.set('tf_voice_config', voiceMerged, 'global');
                        } catch (e) {
                        }
                        console.log('[llm-config] tf_voice_config saved:', JSON.stringify(voiceMerged));
                    } catch (e) {
                        console.warn('[llm-config] tf_voice_config save failed', e);
                    }

                    // 通知 voice 插件重新加载
                    try {
                        if (window.tf_voice && window.tf_voice.invalidateVoiceId) window.tf_voice.clearAllVoiceIds && window.tf_voice.clearAllVoiceIds();
                    } catch (e) {
                    }

                    try {
                        tavo.utils.toast('配置已保存（LLM + 语音）');
                    } catch (e) {
                    }
                    close();
                });
            }

            document.addEventListener('click', function (e) {
                if (e.target === overlay) close();
                var closeBtn = e.target.closest('[data-close-llm]');
                if (closeBtn) {
                    e.stopPropagation();
                    close();
                }
                // overlay 内的 .tf-modal-close 按钮也要能关
                if (overlay && overlay.contains(e.target) && e.target.classList.contains('tf-modal-close')) close();
            });
            // 暴露面板刷新函数（供 mcs/event_manager 触发刷新）
            window._tfPanel_refresh = function (reason) {
                try {
                    loadStory().then(renderBody);
                } catch (e) {
                }
            };
        })();
    </script>
