<!-- toonflow_story_event_manager - 故事面板（完整对齐 Toonflow-game-web ScenePlay play-sheet--setting） -->
<!-- 栏目：角色列表(跑马灯关键信息) / 敌人状态 / 故事设定 / help(?) / 世界书 / 当前章节事件 / 对话模式 / 故事编辑 -->
<style>
    /* ===== 跑马灯（对齐 web marquee-left） ===== */
    @keyframes tf-marquee-left {
        0% {
            transform: translateX(0);
        }
        100% {
            transform: translateX(-50%);
        }
    }

    .tf-marquee-container {
        overflow: hidden;
        white-space: nowrap;
    }

    .tf-marquee-content {
        display: inline-block;
        animation: tf-marquee-left 8s linear infinite;
    }

    .tf-marquee-container:hover .tf-marquee-content {
        animation-play-state: paused;
    }

    .tf-role-key-info .tf-marquee-content {
        color: #c78131;
    }

    /* ===== 触发器（底部居右，对齐 web 风格） ===== */
    #tf-story-tab {
        position: fixed;
        bottom: -2px;
        right: 0;
        transform: translateX(-50%);
        z-index: 9990;
        padding: 2px 2px;
        margin: 0;
        background: rgba(8, 24, 43, 0.92);
        border: 1px solid rgba(166, 188, 218, 0.24);
        border-bottom: none;
        border-radius: 14px 14px 0 0;
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #eef5ff;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-sizing: border-box;
        max-width: 70vw;
        transition: border-color .15s;
    }

    #tf-story-tab:hover {
        border-color: rgba(124, 179, 255, .6);
    }

    .tf-tab-name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 91px;
    }

    .tf-tab-chevron {
        color: #ff9966;
        font-size: 16px;
        font-weight: 700;
    }

    /* ===== play-sheet（对齐 web .play-sheet--setting：absolute 底部卡片） ===== */
    #tf-story-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9995;
        display: none;
    }

    #tf-story-overlay.open {
        display: block;
    }

    .tf-sheet {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 0;
        z-index: 4;
        display: grid;
        gap: 10px;
        padding: 14px 12px 18px;
        border-radius: 18px 18px 0 0;
        border: 1px solid rgba(166, 188, 218, 0.24);
        border-bottom: none;
        background: rgba(8, 24, 43, 0.96);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 -12px 40px rgba(5, 14, 26, 0.4);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-height: calc(100vh - 90px);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e8e8e8;
        box-sizing: border-box;
        animation: tf-sheet-up .22s ease-out;
    }

    @keyframes tf-sheet-up {
        from {
            transform: translateY(30px);
            opacity: 0;
        }
        to {
            transform: none;
            opacity: 1;
        }
    }

    /* ===== head（对齐 .play-sheet__head--center） ===== */
    .tf-head {
        position: relative;
        text-align: left;
        padding-right: 64px;
        min-width: 0;
    }

    .tf-head-title {
        color: #fff;
        font-size: 18px;
        font-weight: 900;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    #tf-sheet-body {
        width: 100%;
        overflow: hidden;
    }

    .tf-head-sub {
        margin-top: 6px;
        color: rgba(213, 235, 255, .84);
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    .tf-head-close {
        position: absolute;
        right: 0;
        top: 0;
        min-width: 52px;
        height: 30px;
        border-radius: 999px;
        border: 1px solid rgba(188, 204, 226, .32);
        background: rgba(186, 142, 129, .85);
        color: #eef5ff;
        cursor: pointer;
    }

    /* ===== 角色横滚条（对齐 .play-role-strip / .play-role-pill） ===== */
    .tf-label {
        color: rgba(213, 235, 255, .84);
        font-size: 12px;
    }

    .tf-role-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        width: 100%;
        padding-bottom: 2px;
    }

    .tf-role-pill {
        flex: none;
        width: 56px;
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: rgba(233, 241, 252, .92);
        text-align: center;
        cursor: pointer;
    }

    .tf-role-pill--active {
        color: #fff;
    }

    .tf-role-pill__avatar {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        overflow: hidden;
        display: grid;
        place-items: center;
        border: 2px solid transparent;
        background: rgba(255, 255, 255, .14);
        color: #f4f8ff;
        font-size: 12px;
        font-weight: 900;
        transition: border-color .15s;
    }

    .tf-role-pill--active .tf-role-pill__avatar {
        border-color: rgba(124, 179, 255, .9);
    }

    .tf-role-pill__avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .tf-role-pill__name {
        font-size: 10px;
        line-height: 1.3;
        max-width: 56px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ===== inline card（对齐 .play-inline-card） ===== */
    .tf-card {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(188, 204, 226, .16);
    }

    .tf-card__title {
        color: #fff;
        font-size: 14px;
        font-weight: 800;
    }

    .tf-card__text {
        color: rgba(220, 238, 255, .92);
        font-size: 12px;
        line-height: 1.55;
        word-break: break-word;
    }

    .tf-card__text--dim {
        color: rgba(216, 230, 249, .45);
        font-style: italic;
    }

    .tf-card__marquee {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        padding: 2px 0;
        background: rgba(0, 0, 0, .18);
        border-radius: 6px;
        padding: 4px 8px;
    }

    /* ===== link row 折叠条（对齐 .play-link-row） ===== */
    .tf-link-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        border: 1px solid rgba(188, 204, 226, .16);
        background: rgba(255, 255, 255, .06);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
    }

    .tf-link-row:active {
        background: rgba(255, 255, 255, .1);
    }

    .tf-link-text {
        justify-self: start;
        border: 0;
        padding: 0;
        background: none;
        color: #a9ccff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
    }

    .tf-inline-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid rgba(188, 204, 226, .12);
        border-radius: 10px;
        background: rgba(255, 255, 255, .04);
        color: rgba(226, 239, 255, .92);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
    }

    .tf-state-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: rgba(197, 214, 233, .92);
        font-size: 11px;
        line-height: 1.55;
        background: rgba(0, 0, 0, .25);
        padding: 8px;
        border-radius: 8px;
    }

    /* ===== 敌人卡（对齐 .play-enemy-card） ===== */
    .tf-enemy-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .tf-enemy-card {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(12, 21, 35, .4);
        border: 1px solid rgba(188, 204, 226, .16);
        display: grid;
        gap: 6px;
    }

    .tf-enemy-card__head {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .tf-enemy-card__ava {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        overflow: hidden;
        flex: none;
        background: rgba(255, 255, 255, .12);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 900;
        color: #f4f8ff;
    }

    .tf-enemy-card__ava img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .tf-enemy-card__name {
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }

    .tf-enemy-card__tag {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 6px;
        background: rgba(239, 68, 68, .2);
        color: #fecaca;
        border: 1px solid rgba(239, 68, 68, .35);
    }

    .tf-enemy-card__bar {
        height: 5px;
        border-radius: 3px;
        background: rgba(0, 0, 0, .35);
        overflow: hidden;
    }

    .tf-enemy-card__fill {
        height: 100%;
        background: #ef4444;
        transition: width .3s;
    }

    .tf-enemy-card__fill--mana {
        background: #3b82f6;
    }

    /* ===== 世界书条目（对齐 .play-world-book-item） ===== */
    .tf-wb-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .tf-wb-item {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(12, 21, 35, .4);
        border: 1px solid rgba(188, 204, 226, .16);
    }

    .tf-wb-item__head {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 4px;
    }

    .tf-wb-item__title {
        color: #fff;
        font-size: 13px;
        font-weight: 700;
    }

    .tf-wb-tag {
        display: inline-block;
        padding: 1px 7px;
        font-size: 11px;
        border-radius: 7px;
        background: rgba(96, 165, 250, .18);
        color: #bfdbfe;
        border: 1px solid rgba(96, 165, 250, .35);
    }

    .tf-wb-tag--const {
        background: rgba(34, 197, 94, .18);
        color: #bbf7d0;
        border-color: rgba(34, 197, 94, .35);
    }

    .tf-wb-item__content {
        color: rgba(220, 238, 255, .82);
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .tf-wb-page {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 6px;
        font-size: 12px;
        color: rgba(220, 238, 255, .75);
    }

    .tf-wb-page button {
        padding: 4px 12px;
        border-radius: 8px;
        border: 1px solid rgba(188, 204, 226, .24);
        background: rgba(255, 255, 255, .08);
        color: #eef5ff;
        cursor: pointer;
        font-size: 12px;
    }

    .tf-wb-page button:disabled {
        opacity: .4;
    }

    /* ===== 事件列表（对齐 .play-event-item） ===== */
    .tf-event-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .tf-event-item {
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(12, 21, 35, .4);
        border: 1px solid rgba(188, 204, 226, .16);
    }

    .tf-event-item__head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 4px;
    }

    .tf-event-item__index {
        color: #fff;
        font-size: 12px;
        font-weight: 700;
    }

    .tf-event-item__meta {
        color: rgba(191, 219, 254, .85);
        font-size: 11px;
    }

    .tf-event-item__summary {
        color: rgba(220, 238, 255, .9);
        font-size: 12px;
        line-height: 1.5;
    }

    .tf-event-item__facts {
        color: rgba(191, 219, 254, .75);
        font-size: 11px;
        line-height: 1.5;
        margin-top: 2px;
    }

    .tf-progress-bar {
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, .35);
        overflow: hidden;
        margin: 6px 0;
    }

    .tf-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #7cb3ff, #4ade80);
        transition: width .3s;
    }

    .tf-tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(255, 255, 255, .1);
        color: rgba(220, 238, 255, .85);
        font-size: 11px;
    }

    /* ===== 编辑器表单（对齐 SceneCreate 卡片风） ===== */
    .tf-edit-field {
        display: grid;
        gap: 5px;
    }

    .tf-edit-field label {
        color: rgba(213, 235, 255, .8);
        font-size: 12px;
        font-weight: 600;
    }

    .tf-edit-field textarea, .tf-edit-field input[type=text] {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 10px;
        border-radius: 10px;
        border: 1px solid rgba(188, 204, 226, .2);
        background: rgba(12, 21, 35, .55);
        color: #e8f2ff;
        font-size: 13px;
        font-family: inherit;
        line-height: 1.55;
        resize: vertical;
    }

    .tf-edit-field textarea:focus, .tf-edit-field input:focus {
        outline: none;
        border-color: rgba(124, 179, 255, .65);
    }

    .tf-edit-count {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: rgba(160, 185, 215, .7);
    }

    .tf-switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 2px;
        font-size: 12px;
        color: rgba(220, 238, 255, .9);
    }

    .tf-chapter-pill-row {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 4px 0;
    }

    .tf-chapter-pill {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid rgba(188, 204, 226, .24);
        background: rgba(255, 255, 255, .06);
        color: #eef5ff;
        font-size: 12px;
        cursor: pointer;
    }

    .tf-chapter-pill.active {
        border-color: rgba(124, 179, 255, .8);
        background: rgba(124, 179, 255, .14);
    }

    .tf-chapter-pill .del {
        color: #fca5a5;
        font-weight: 900;
        padding: 0 2px;
    }

    .tf-btn {
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid rgba(188, 204, 226, .28);
        background: rgba(255, 255, 255, .08);
        color: #eef5ff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
    }

    .tf-btn--primary {
        background: rgba(124, 179, 255, .85);
        color: #08121f;
        border: none;
    }

    .tf-btn--publish {
        background: linear-gradient(135deg, rgba(99, 179, 237, .92), rgba(168, 85, 247, .88));
        color: #fff;
        border: none;
    }

    .tf-btn--danger {
        background: rgba(239, 68, 68, .2);
        color: #fecaca;
        border-color: rgba(239, 68, 68, .4);
    }

    .tf-btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .tf-chapter-bg {
        width: 100%;
        aspect-ratio: 16/9;
        border-radius: 12px;
        border: 1px dashed rgba(188, 204, 226, .3);
        background: rgba(12, 21, 35, .5);
        display: grid;
        place-items: center;
        color: rgba(160, 185, 215, .7);
        font-size: 12px;
        cursor: pointer;
        overflow: hidden;
    }

    .tf-chapter-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .tf-help-sec {
        margin-bottom: 8px;
    }

    .tf-help-sec h4 {
        margin: 0 0 4px;
        color: #a9ccff;
        font-size: 13px;
    }

    .tf-help-sec p {
        margin: 0 0 4px;
        color: rgba(220, 238, 255, .85);
        font-size: 12px;
        line-height: 1.6;
    }

    .tf-help-sec code {
        background: rgba(0, 0, 0, .3);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
        color: #c78131;
    }

    /* ===== 故事配置主按钮（对齐 SceneCreate create-primary-btn 风格：醒目、可识别为配置入口） ===== */
    .tf-config-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        box-sizing: border-box;
        padding: 13px 16px;
        border-radius: 14px;
        cursor: pointer;
        border: none;
        background: linear-gradient(135deg, rgba(124, 179, 255, .92), rgba(96, 140, 255, .88));
        color: #081222;
        text-align: left;
        box-shadow: 0 4px 16px rgba(96, 140, 255, .35);
        transition: filter .15s, transform .1s;
    }

    .tf-config-btn:active {
        transform: scale(.985);
        filter: brightness(.94);
    }

    .tf-config-btn__icon {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        flex: none;
        display: grid;
        place-items: center;
        font-size: 16px;
        font-weight: 900;
        background: rgba(8, 18, 34, .18);
        color: #081222;
    }

    .tf-config-btn__body, .tf-config-btn__label {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: .5px;
    }

    .tf-config-btn__sub {
        flex: 1;
        min-width: 0;
        font-size: 10.5px;
        font-weight: 600;
        opacity: .75;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .tf-config-btn__arrow {
        flex: none;
        font-size: 15px;
        font-weight: 900;
    }

    /* 折叠动画 */
    .tf-collapse {
        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transition: max-height .25s ease, opacity .2s ease;
    }

    /* 角色详情参数卡网格（对齐 web param-grid） */
    .tf-role-detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 8px 0;
    }

    .tf-role-detail-cell {
        background: rgba(8, 18, 34, .35);
        border: 1px solid rgba(188, 204, 226, .14);
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 0;
    }

    .tf-role-detail-cell--long {
        grid-column: 1 / -1;
    }

    .tf-role-detail-label {
        font-size: 10.5px;
        color: rgba(160, 185, 215, .75);
        margin-bottom: 3px;
    }

    .tf-role-detail-value {
        font-size: 12.5px;
        color: #eef5ff;
        line-height: 1.5;
        word-break: break-word;
    }

    .tf-collapse.open {
        max-height: 4000px;
        opacity: 1;
    }
</style>

<!-- 故事加载中遮罩（boot 进行时显示） -->
<div id="tf-boot-overlay"
     style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(8,24,43,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#eef5ff;font-family:system-ui,sans-serif;">
    <div style="font-size:24px;font-weight:900;">⏳ 故事加载中</div>
    <div id="tf-boot-stage" style="font-size:13px;color:rgba(191,219,254,.85);">检测会话状态…</div>
    <div id="tf-boot-session" style="font-size:11px;color:rgba(160,185,215,.7);"></div>
    <div style="display:flex;gap:4px;margin-top:6px;">
        <span class="tf-boot-dot"></span><span class="tf-boot-dot"></span><span class="tf-boot-dot"></span>
    </div>
</div>
<style>
    @keyframes tf-boot-bounce {
        0%, 80%, 100% {
            opacity: .3;
        }
        40% {
            opacity: 1;
        }
    }

    .tf-boot-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #7cb3ff;
        animation: tf-boot-bounce 1.4s infinite;
    }

    .tf-boot-dot:nth-child(2) {
        animation-delay: .2s;
    }

    .tf-boot-dot:nth-child(3) {
        animation-delay: .4s;
    }
</style>

<!-- 底部触发器 -->
<div id="tf-story-tab">
    <span class="tf-tab-name" id="tf-tab-name">故事信息</span>
    <span class="tf-tab-chevron">›</span>
</div>

<!-- play-sheet -->
<div id="tf-story-overlay">
    <div class="tf-sheet" id="tf-sheet">
        <div class="tf-head">
            <div class="tf-head-title" id="tf-head-title">故事</div>
            <div class="tf-head-sub" id="tf-head-sub"></div>

    <script>
        (function () {
            let T = (typeof tavo !== 'undefined') ? tavo : (window.tavo || null);

            // 获取带 chat_id 的变量名
            var _panelChatId = null;

            async function getPanelChatId() {
                if (_panelChatId) return _panelChatId;
                try {
                    var chat = await T.chat.current();
                    _panelChatId = chat && chat.id;
                } catch (e) {
                }
                return _panelChatId;
            }

            function panelNs(name) {
                // chat scope: tf_story.{name}（不带 chat_id）
                return 'tf_story.' + name;
            }

            function panelNsGlobal(name) {
                // global scope: tf_story_{chat_id}.{name}（带 chat_id）
                return _panelChatId ? ('tf_story_' + _panelChatId + '.' + name) : ('tf_story.' + name);
            }

            function tmmNs(name) {
                return _panelChatId ? ('tmm_' + name + '_' + _panelChatId) : ('tmm_' + name);
            }

            function progressNs() {
                // chat scope: tf_progress（不带 chat_id）
                return 'tf_progress';
            }

            function progressNsGlobal() {
                // global scope: tf_progress_{chat_id}（带 chat_id）
                return _panelChatId ? ('tf_progress_' + _panelChatId) : 'tf_progress';
            }

            // Tavo 的 chat 变量经 T.get 返回的是包装对象 {target,name,found,value}，真实数据在 .value 里。
            // 不解包的话 v.chapters / v.level 等都是 undefined，会被误判为"空"并拿默认值覆盖，清空配置。
            function readChatVar(name) {
                try {
                    var v = T.get(name);
                    var guard = 0;
                    while (v && typeof v === 'object' && v.found !== undefined && ('value' in v) && guard < 5) {
                        v = v.value;
                        guard++;
                    }
                    return v;
                } catch (e) {
                    return null;
                }
            }

            // 读变量：先 global（tavo_chat_reset 不影响），再 chat；统一解包 found/value 包装
            // chatName: chat scope 变量名；globalName: global scope 变量名（可能不同）
            function readVarDualScope(chatName, globalName) {
                var result = null;
                // 先查 global scope
                try {
                    var v = T.get(globalName, 'global');
                    var guard = 0;
                    while (v && typeof v === 'object' && v.found !== undefined && ('value' in v) && guard < 5) {
                        v = v.value;
                        guard++;
                    }
                    if (v !== null && v !== undefined && v !== '') result = v;
                } catch (e) {
                }
                // global 没有或为空，查 chat scope
                if (result === null || result === '' || (typeof result === 'object' && Object.keys(result).length === 0)) {
                    try {
                        var v2 = T.get(chatName);
                        var guard2 = 0;
                        while (v2 && typeof v2 === 'object' && v2.found !== undefined && ('value' in v2) && guard2 < 5) {
                            v2 = v2.value;
                            guard2++;
                        }
                        if (v2 !== null && v2 !== undefined && v2 !== '') result = v2;
                    } catch (e) {
                    }
                }
                return result;
            }

            // 向后兼容：旧函数，chat 和 global 用同一个名字
            function readVarAnyScope(name) {
                return readVarDualScope(name, name);
            }

            var CHAPTER_GUIDE = [

                        '系统会自动追踪事件进度，例如：`[s]开场 -> [i]交流 -> []结束`。',

                        '非事件内容不会影响进度追踪，但会作为上下文提供给AI。']
                },
                {
                    title: '推荐写法', lines: [
                        '先写本章开场和场景，再写角色互动，最后写用户需要完成的目标。',
                        '成功条件里只写结局判断，例如"用户选择了跟随A或B"或"用户发言达到5次"。',
                        '利用随机编排功能可以让章节更具可玩性，不需要为每个NPC写死台词。']

            function pin(id) {
                var el = document.getElementById(id);
                if (!el) return null;
                var prev = window['__pin_' + id];
                if (prev && prev !== el && prev.parentNode) prev.parentNode.removeChild(prev);
                if (el.parentNode !== document.body) document.body.appendChild(el);
                window['__pin_' + id] = el;
                return el;
            }

            pin('tf-story-tab');
            pin('tf-story-overlay');

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
                    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
                });
            }

            function scalar(v) {
                var t = (v == null ? '' : String(v)).trim();
                return (t === 'null' || t === 'undefined') ? '' : t;
            }

            /* ================= 数据构建（沿用旧版角色解析） ================= */
            function parseFilePath(p) {
                if (!p) return null;
                var m = String(p).match(/^files\/(global|chat)\/(.+)$/);
                if (m) return {scope: m[1], name: m[2]};
                return {scope: 'global', name: p};
            }

            async function resolveAvatarUrl(p) {
                if (!p || !T || !T.file) return '';
                var pr = parseFilePath(p);
                try {
                    var du = await T.file.load(pr.name, {scope: pr.scope, encoding: 'dataUrl'});
                    if (typeof du === 'string') return du;
                    if (du && du.content) return du.content;
                } catch (e) {
                }
                try {
                    return T.file.url(pr.name, pr.scope);
                } catch (e) {
                }
                return p;
            }

            async function resolveChapterBg(root) {
                // 读 tf_chapter_backgrounds（global/chat 都要查）
                var chapterBgsVar = _panelChatId ? ('tf_chapter_backgrounds_' + _panelChatId) : 'tf_chapter_backgrounds';
                var chapterBgs = readVarDualScope('tf_chapter_backgrounds', chapterBgsVar) || {};
                var storyEdit = readVarDualScope(panelNs('edit'), panelNsGlobal('edit')) || {};
                var curIdx = (storyEdit.currentChapterIndex != null) ? storyEdit.currentChapterIndex : 0;
                // chapterBgs 的 key 格式：chapter_1, chapter_2 ...（同步时写入的 key）
                var bgPath = chapterBgs['chapter_' + (curIdx + 1)] || chapterBgs['chapter_' + curIdx] || '';

                var boxes = root.querySelectorAll('.tf-chapter-bg[data-chbg], .tf-chapter-bg-img[data-bg]');
                for (var box of boxes) {
                    var p = box.getAttribute('data-bg') || '';
                    if (!p) {
                        box.textContent = '上传 / AI 生成章节背景图（粘贴图片 URL 或 files/ 路径）';
                        continue;
                    }
                    if (/^https?:\/\//.test(p)) {
                        box.innerHTML = '<img src="' + esc(p) + '">';
                        continue;
                    }
                    // 优先用 tf_chapter_backgrounds 的标准路径（files/chat/xxx 直接当 src）
                    var resolved = bgPath || p;
                    if (resolved) {
                        box.innerHTML = '<img src="' + esc(resolved) + '" style="max-width:200px;max-height:80px;border-radius:6px;">';
                    } else {
                        box.textContent = '🖼️ 背景图加载失败：' + p;
                    }
                }
            }

            async function detectStagePlugin() {
                var note = document.getElementById('tf-orch-note');
                if (!note) return;
                var installed = true;
                try {
                    if (T && T.plugin && T.plugin.search) {
                        var res = await T.plugin.search({limit: 100});
                        var items = (res && res.items) || [];
                        installed = items.some(function (p) {
                            return p.pluginId === 'com.toonflow.multi-character-stage' && p.enabled !== false;
                        });
                    }
                } catch (e) {
                    installed = true;
                }
                note.innerHTML = installed
                    ? '✅ 已检测到「角色编排器」+「角色发言」插件，推荐使用「角色编排插件」。'
                    : '⚠️ 未检测到角色编排器，选择「角色编排插件」将自动回退跟随系统。';
                note.style.color = installed ? 'rgba(74,222,128,.92)' : 'rgba(252,165,165,.92)';
            }

            function extractCardJson(desc) {
                if (!desc) return null;
                var m = desc.match(/角色参数卡[\s\S]*?```(?:json)?\s*([\s\S]*?)```/);
                if (m) {
                    try {
                        return JSON.parse(m[1].trim());
                    } catch (e) {
                    }
                }
                var m2 = desc.match(/```(?:json)?\s*(\{[\s\S]*?\})\s*```/);
                if (m2) {
                    try {
                        return JSON.parse(m2[1].trim());
                    } catch (e) {
                    }
                }
                return null;
            }

            function parseFieldMap(desc) {
                var map = {};
                if (!desc) return map;
                scalar(desc).split(/\r?\n/).forEach(function (line) {
                    var m = line.match(/^\s*\*\*([^*]+?)\*\*\s*[:：]\s*(.+?)\s*$/);
                    if (m) map[m[1].trim().toLowerCase()] = m[2].trim();
                });
                return map;
            }

            function numOr(v, fb) {
                var n = Number(scalar(v));
                return Number.isFinite(n) ? Math.floor(n) : fb;
            }

            function listOr(v) {
                if (Array.isArray(v)) return v.map(scalar).filter(Boolean);
                if (typeof v === 'string' && v) return v.split(/[\r\n；;、,，]/).map(scalar).filter(Boolean);
                return [];
            }

            function localizeCard(c) {
                var d = (c && c.data) ? c.data : (c || {});
                var embedded = extractCardJson(d.description || '');
                var src = (embedded && typeof embedded === 'object') ? embedded : {};
                var rawFm = parseFieldMap(d.description || '');
                // 中文字段名 -> 英文 key 映射（覆盖在 rawFm 上）
                var ZH_TO_KEY = {
                    '角色类型': 'role_type',
                    '角色名': 'name',
                    '性别': 'gender',
                    '年龄': 'age',
                    '等级': 'level',
                    '等级称号': 'level_desc',
                    '经验值': 'exp',
                    '下一级所需经验': 'next_level_exp',
                    '性格': 'personality',
                    '外貌': 'appearance',
                    '音色特点': 'voice',
                    '音色': 'voice',
                    '技能': 'skills',
                    '物品': 'items',
                    '装备': 'equipment',
                    '血量': 'hp',
                    '蓝量': 'mp',
                    '金钱': 'money',
                    '货币': 'money',
                    '当前行为': 'role_key_information',
                    '关键信息': 'role_key_information',
                    '角色关键信息': 'role_key_information',
                    '其他': 'other',
                    '原设定': 'raw_setting',
                };
                var fm = {};
                for (var k in rawFm) {
                    var zh = String(k).toLowerCase();
                    fm[zh] = rawFm[k];
                    var en = ZH_TO_KEY[zh] || (rawFm[k] && rawFm[k].length && zh); // 保留原 key
                    if (en && en !== zh) fm[en] = rawFm[k];
                }

                function read() {
                    for (var i = 0; i < arguments.length; i++) {
                        var v = scalar(src[arguments[i]] || fm[String(arguments[i]).toLowerCase()] || d[arguments[i]]);
                        if (v) return v;
                    }
                    return '';
                }

                function readZh() {
                    // 支持传入中文 label 直接查
                    for (var i = 0; i < arguments.length; i++) {
                        var k = String(arguments[i]).toLowerCase();
                        var v = scalar(src[k] || fm[k]);
                        if (v) return v;
                    }
                    return '';
                }

                var descText = scalar(d.description || '');
                var charName = scalar(d.name) || scalar(read('name'));
                var roleType = scalar(src.role_type || d.roleType || readZh('role_type', '角色类型'));
                if (roleType === '旁白') roleType = 'narrator'; // 中文字面值归一化
                if (roleType === '万能角色') roleType = 'general';
                if (roleType === '系统角色') roleType = 'system';
                if (!roleType) {
                    // 1) 角色名是最强信号：名字本身就是类型标识
                    if (/^旁白$|^narrator$/i.test(charName)) roleType = 'narrator';
                    else if (/^某男子$|^某女子$|^万能/.test(charName)) roleType = 'general';
                    else if (/^系统$|^system$/i.test(charName)) roleType = 'system';
                    // 2) desc 显式角色类型字段（**角色类型**：旁白）
                    else if (/角色类型\s*[:：]\s*旁白/.test(descText)) roleType = 'narrator';
                    else if (/角色类型\s*[:：]\s*万能/.test(descText)) roleType = 'general';
                    else if (/角色类型\s*[:：]\s*系统/.test(descText)) roleType = 'system';
                    // 3) 弱信号：desc 内容关键词（某女子/某男子的"饰演"用法）
                    else if (/万能角色|不可作为具体角色独立使用/.test(descText)) roleType = 'general';
                    else if (/饰演|扮演虚无/.test(descText)) roleType = 'general';
                    else if (/旁白|系统叙事|系统旁白/.test(descText)) roleType = 'narrator';
                    else roleType = 'npc';
                }
                var level = numOr(src.level ?? fm['level'] ?? readZh('level', '等级'), null);
                var level_desc = read('level_desc', 'levelDesc') || readZh('level_desc', '等级称号');
                var hp = numOr(src.hp ?? fm['hp'] ?? readZh('hp', '血量'), null);
                var mp = numOr(src.mp ?? fm['mp'] ?? readZh('mp', '蓝量'), null);
                var money = numOr(src.money ?? fm['money'] ?? readZh('money', '金钱'), null);
                var gender = read('gender') || readZh('gender', '性别');
                if (!gender) {
                    if (/男/.test(descText)) gender = '男'; else if (/女/.test(descText)) gender = '女';
                }

                // 数组类：也支持中文 key
                function listZh(enKey) {
                    var raw = src[enKey] || fm[enKey];
                    if (raw) return listOr(raw);
                    // 尝试中文
                    for (var k in ZH_TO_KEY) {
                        if (ZH_TO_KEY[k] === enKey && fm[k]) return listOr(fm[k]);
                    }
                    return [];
                }

                function textZh(enKey) {
                    return read(enKey) || readZh(enKey);
                }

                return {
                    name: read('name') || d.name || '未命名',
                    raw_setting: read('raw_setting') || descText,
                    gender: gender, age: numOr(src.age ?? fm['age'] ?? readZh('age', '年龄'), null),
                    level: level ?? 1, level_desc: level_desc,
                    personality: textZh('personality'),
                    appearance: textZh('appearance'),
                    voice: textZh('voice'),
                    skills: listZh('skills'),
                    items: listZh('items'),
                    equipment: listZh('equipment'),
                    hp: hp ?? 100, mp: mp ?? 0, money: money ?? 0,
                    exp: numOr(src.exp ?? fm['exp'] ?? readZh('exp', '经验值'), 0),
                    next_level_exp: numOr(src.next_level_exp ?? fm['next_level_exp'] ?? readZh('next_level_exp', '下一级所需经验'), 0),
                    role_key_information: textZh('role_key_information'),
                    other: listZh('other'),
                    sample: scalar(d.first_mes || d.sample),
                    roleType: roleType,
                };
            }

            function isCardEmpty(c) {
                if (!c) return true;

            async function buildStory() {
                if (!T || !T.chat) return null;
                var chat = await T.chat.current();
                if (!chat) return null;
                // 设置当前 chatId
                _panelChatId = chat.id;
                // 静态基准卡（记忆插件解析好的权威参数卡）按名兜底：优先读 tmm_story（含动态数据），回退 tmm_story_static
                var staticStory = readChatVar(tmmNs('story')) || readChatVar(tmmNs('story_static')) || null;
                var staticByName = {};
                if (staticStory && staticStory.characters) {
                    staticStory.characters.forEach(function (c) {
                        if (c && c.name) staticByName[c.name] = c;
                    });
                }
                var cards = [];
                var personaId = chat.personaId || (chat.persona && chat.persona.id);
                if (personaId) {
                    var pf = null;
                    try {
                        pf = await T.persona.get(personaId);
                    } catch (e) {
                    }
                    var pCard = localizeCard(pf || {});
                    var pStatic = staticByName[(chat.persona && chat.persona.name) || (pf && pf.name) || '用户'];
                    if (isCardEmpty(pCard) && pStatic && pStatic.card) pCard = Object.assign({}, pStatic.card);
                    cards.push({
                        id: personaId,
                        name: (chat.persona && chat.persona.name) || (pf && pf.name) || '用户',
                        roleType: 'player',
                        avatar: (pf && pf.avatar) || '',
                        card: pCard
                    });
                }
                var npcs = await Promise.all((chat.characters || []).map(async function (c) {
                    var full = null;
                    try {
                        full = await T.character.get(c.id);
                    } catch (e) {
                    }
                    var d = (full && full.data) ? full.data : (full || c || {});
                    var card = localizeCard(full || c);
                    var sc = staticByName[c.name] || staticByName[d.name];
                    if (isCardEmpty(card) && sc && sc.card) card = Object.assign({}, sc.card);
                    return {
                        id: c.id,
                        name: c.name || d.name || '未命名',
                        roleType: d.roleType || 'npc',
                        avatar: d.avatar || c.avatar || '',
                        card: card
                    };
                }));
                // 过滤掉用户手动创建的"旁白"角色卡（旁白是内置虚拟角色，不该作为 NPC 占一个位置）
                var isNarratorName = function (n) {
                    return /^(旁白|narrator)$/i.test(String(n || '').trim());
                };
                npcs = npcs.filter(function (c) {
                    return !isNarratorName(c.name);
                });

                // 内置旁白（对齐 Toonflow-game narratorName 常量）：固定插在用户之后、NPC 之前
                var narratorCard = {
                    name: '旁白',

                    personality: '客观、简洁、画面感',
                    appearance: '',
                    voice: '混合（清朗温润）',
                    skills: [], items: [], equipment: [],
                    level: null, hp: null, mp: null, money: null,
                    role_key_information: '',
                    sample: '夜色笼罩着黑风寨，灯火在风里摇曳。'
                };
                var narratorStatic = staticByName['旁白'];
                if (narratorStatic && narratorStatic.card) narratorCard = Object.assign(narratorCard, narratorStatic.card, {roleType: 'narrator'});
                cards.push({id: '__narrator__', name: '旁白', roleType: 'narrator', avatar: '', card: narratorCard});

                cards = cards.concat(npcs);
                // 世界书

                return {

            // 解析章节内容的 Phase/Stage 结构（对齐 entry.js parseProgress）

                var phases = [];

                var order = 0;
                var lines = (content || '').split(/\r?\n/);
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i];
                    // ## Phase 名
                    if (/^##\s/.test(line)) {
                        var m = line.match(/^##\s+(.+)/);
                        if (m) {
                            currentPhase = {name: m[1].trim(), events: [], index: order++};
                            phases.push(currentPhase);
                        }
                    }
                    // ### [状态] 事件名
                    else if (/^###\s/.test(line) && currentPhase) {
                        var em = line.match(/^###\s+(?:\[(\w)\]\s*)?(.+)/);
                        if (em) {
                            var stateMark = em[1] || '';
                            var evtName = em[2].trim();
                            currentPhase.events.push({name: evtName, state: stateMark});
                        }
                    }
                }
                return phases;
            }

            // 当前进度快照（从 tf_progress_{chat_id} 读）
            function getProgressState() {
                try {
                    var raw = readVarDualScope(progressNs(), progressNsGlobal());
                    if (raw && typeof raw === 'object') return raw;
                } catch (e) {
                }
                return {};
            }

            // 状态标签
            var STAGE_STATUS_LABELS = {'s': '完成', 'i': '进行中', 'f': '失败'};

            function stageStateLabel(state) {
                return STAGE_STATUS_LABELS[state] || '未开始';
            }

            // Stage 状态颜色
            var STAGE_STATE_COLOR = {'s': '#4ade80', 'i': '#fbbf24', 'f': '#f87171'};

            // 阶段状态判断：[s]已完成 [i]进行中 [ ]未开始
            function phaseStateMark(phaseIdx, curPhase, curStage, completedCount) {
                if (phaseIdx < curPhase) return 's';
                if (phaseIdx === curPhase) {
                    var stages = phase.events || [];
                    if (curStage >= stages.length) return 's';
                    if (curStage < completedCount) return 's';
                    return curStage < completedCount ? 's' : 'i';
                }
                return '';
            }

            function eventsHtml() {
                // 先取章节目标（当前章节 successCondition，conditionVisible=false 时显示星号）
                var _prog = getProgressState();
                var _chapters = (_edit && _edit.chapters) || [];
                var _curIdx = Math.max(0, Math.min(_prog.currentChapterIndex || 0, Math.max(_chapters.length - 1, 0)));
                var _curCh = _chapters[_curIdx] || {};
                var objective = (_curCh.conditionVisible === false)
                    ? '*****'
                    : ((_curCh.successCondition || '未设置').slice(0, 20));

                var h = '<div class="tf-card"><div class="play-objective-chip">章节目标:<span class="play-objective-text">' + esc(objective) + '</span></div><div class="tf-card__title">当前事件进度</div>';

                var prog = getProgressState();
                var chapters = (_edit && _edit.chapters) || [];
                var curIdx = Math.max(0, Math.min(prog.currentChapterIndex || 0, Math.max(chapters.length - 1, 0)));
                var curCh = chapters[curIdx] || {};
                var cond = (curCh.conditionVisible === false) ? '*****' : (curCh.successCondition || '');

                // 顶部：当前事件目标（当前事件的 stage 链，带状态标记）
                var phases = parseChapterPhases(curCh.content || '');
                var curPhaseIdx = Math.max(0, prog.currentPhase || 0);
                var curStageIdx = Math.max(0, prog.currentEvent || 0);
                var curPhase = phases[curPhaseIdx];
                if (curPhase && curPhase.events && curPhase.events.length) {
                    var stageChain = curPhase.events.map(function (ev, ei) {
                        var st = ei < curStageIdx ? 's' : (ei === curStageIdx ? 'i' : '');
                        return '[' + st + ']' + ev.name;
                    }).join(' -> ');
                    h += '<div class="tf-card__text">当前事件目标：' + esc(stageChain) + '</div>';
                }

                // 扁平事件列表（对齐 Toonflow chapterOutlineEventItems：## Phase = 一条事件）
                var completedEvents = {};
                ((prog.completedEvents || []) || []).forEach(function (id) {
                    completedEvents[id] = true;
                });
                var currentPhaseId = 'phase:' + curPhaseIdx;

                var h2 = '';
                var hasVisible = false;
                phases.forEach(function (phase, pi) {
                    if (/^非事件/.test(phase.name)) return; // 非事件段不进列表
                    hasVisible = true;
                    var isCurrent = (pi === curPhaseIdx) && !completedEvents['phase:' + pi];
                    var isCompleted = completedEvents['phase:' + pi] === true || pi < curPhaseIdx;
                    var statusLabel = isCompleted ? '已完成' : (isCurrent ? '进行中' : '未开始');
                    var statusColor = isCompleted ? '#4ade80' : (isCurrent ? '#fbbf24' : 'rgba(220,238,255,.45)');
                    // 事件摘要：stage 链（带状态标记）
                    var chain = (phase.events || []).map(function (ev, ei) {
                        var st = '';
                        if (isCompleted) st = 's';
                        else if (isCurrent) st = ei < curStageIdx ? 's' : (ei === curStageIdx ? 'i' : '');
                        return '[' + st + ']' + ev.name;
                    }).join(' -> ');

                    h2 += '<div class="tf-event-item"' + (isCurrent ? ' style="border-color:rgba(124,179,255,.45);"' : '') + '>'
                        + '<div class="tf-event-item__head">'
                        + '<span class="tf-event-item__index">事件 ' + (pi + 1) + '</span>'
                        + '<span class="tf-event-item__meta" style="color:' + statusColor + ';">章节内容 · 场景事件 · ' + statusLabel + '</span>'
                        + '</div>'
                        + '<div class="tf-event-item__summary">' + esc(chain || phase.name) + '</div>'
                        + '</div>';
                });

                // 末尾固定事件：结束条件检查（对齐 Toonflow chapter_ending_check）
                if (cond) {
                    var endActive = phases.length && curPhaseIdx >= phases.length;
                    h2 += '<div class="tf-event-item">'
                        + '<div class="tf-event-item__head">'
                        + '<span class="tf-event-item__index">事件 ' + (phases.length + 1) + '</span>'
                        + '<span class="tf-event-item__meta" style="color:rgba(191,219,254,.85);">结束条件检查 · 固定事件</span>'
                        + '</div>'
                        + '<div class="tf-event-item__summary">结束条件：' + esc(cond) + '</div>'
                        + '<div class="tf-event-item__facts"> 事实：成功条件：' + esc(cond) + '</div>'
                        + '</div>';
                    hasVisible = true;
                }

                if (hasVisible) {
                    h += '<div class="tf-event-list">' + h2 + '</div>';
                } else {
                    h += '<div class="tf-card__text" style="color:rgba(220,238,255,.5);">当前章节事件尚未生成。</div>';
                }

                // 剧情记忆摘要（对齐 Toonflow memorySummary）
                var facts = [], memSummary = '';
                try {
                    var mem = readChatVar('tmm');
                    if (mem) {
                        facts = (mem.meta && mem.meta.facts) || [];
                        memSummary = (mem.meta && mem.meta.summary) || '';
                    }
                } catch (e) {
                }
                if (memSummary) {
                    h += '<div class="tf-card__text" style="color:#fbbf24;font-size:11px;margin-top:6px;">剧情记忆：' + esc(memSummary.slice(0, 120)) + '</div>';
                }

                h += '</div>';
                return h;
            }

            // 故事进度（章节结局判定器 / 自由模式状态）
            function progressHtml() {

                h += '<div class="tf-card__text">总章节: ' + total + ' | 已完成: ' + (p.completedChapters || []).length + ' | 失败尝试: ' + (p.failedAttempts || 0) + '</div>';
                if (p.storyCompleted) h += '<div class="tf-card__text" style="color:#fbbf24;">🎉 故事已完成！</div>';
                if (p.sessionFreeMode) h += '<div class="tf-card__text" style="color:#7cb3ff;">🆓 自由模式（不再判定章节）</div>';
                if (cur && !p.storyCompleted) {
                    var pct = total > 0 ? Math.round((p.completedChapters || []).length / total * 100) : 0;
                    h += '<div class="tf-progress-bar"><div class="tf-progress-fill" style="width:' + pct + '%"></div></div>';
                    h += '<div class="tf-card__text">当前章节 (' + (idx + 1) + '/' + total + '): ' + esc(cur.title || '') + '</div>';

                        var condText = cur.successCondition.length > 80 ? cur.successCondition.slice(0, 80) + '…' : cur.successCondition;
                        h += '<div class="tf-card__text">完成条件: ' + esc(condText) + '</div>';

                    // 事件进度（Phase Graph）
                    var phases = p.phases || [];
                    if (phases.length) {
                        h += '<div class="tf-card__text">事件进度 (' + phases.length + ' 阶段):</div>';
                        h += '<div class="tf-event-list">';
                        phases.forEach(function (ph, pi) {
                            var mark = pi < (p.currentPhase || 0) ? '[s]' : (pi === (p.currentPhase || 0) ? '[i]' : '[ ]');
                            h += '<div class="tf-event-item"><div class="tf-event-item__head">'
                                + '<span class="tf-event-item__index">' + mark + ' 阶段 ' + (pi + 1) + ': ' + esc(ph.name || '') + '</span></div>';
                            if (ph.events && ph.events.length) {
                                h += '<div class="tf-event-item__summary">';
                                ph.events.forEach(function (ev, ei) {

                                });
                                h += '</div>';
                            }
                            h += '</div>';
                        });
                        h += '</div>';
                    }

                h += '</div>';

                    if (!_edit.orchestration) _edit.orchestration = 'plugin';
                    return;
                }

                // 兜底1：世界书 entry 「章节备份」（tavo global 大 object 写不进去，世界书是最后防线）
                _edit = defaultEdit();
                var wbEntries = (_story.worldbook && _story.worldbook.entries) || [];
                var backEntry = wbEntries.filter(function (e) {
                    return e.name === '章节备份' || e.name === '静态数据';
                })[0];
                if (backEntry && backEntry.content) {
                    var c = backEntry.content;
                    var mi = c.match(/【简介】\s*([\s\S]*?)(?=\s*【全局背景】|$)/);
                    if (mi) _edit.intro = mi[1].trim();
                    var mb = c.match(/【全局背景】\s*([\s\S]*?)(?=\s*===\s|$)/);
                    if (mb) _edit.globalBackground = mb[1].trim();
                    // 解析章节：每章以 "=== 标题 ===" 起头
                    var creg = /===\s+([^=\n]+?)\s+===\s*\n\[openingRole:\s*([^\]]*)\]\s*\n\[openingLine:\s*([^\]]*)\]\s*\n\[successCondition:\s*([^\]]*)\][\s\S]*?(?====\s|$)/g;
                    var m;
                    while ((m = creg.exec(c)) !== null) {
                        _edit.chapters.push({
                            title: m[1].trim(),
                            openingRole: m[2].trim() || '旁白',
                            openingLine: m[3].trim(),
                            successCondition: m[4].trim(),
                            background: '', content: '', conditionVisible: true,
                            entryCondition: '', musicAutoPlay: false,
                        });
                    }
                }
                // 兜底2：简介/全局背景从「故事简介」「全局背景」单条 entry 读
                if (!_edit.intro) {

                        var m2 = (introE.content || '').match(/【简介】\s*([\s\S]*?)(?=\s*【|$)/);
                        if (m2) _edit.intro = m2[1].trim();

                }
                if (!_edit.globalBackground) {
                    var bgE = wbEntries.filter(function (e) {
                        return e.name === '全局背景' || /【全局背景】/.test(e.name);

                    if (bgE) {

                        if (m3) _edit.globalBackground = m3[1].trim();

                        openingLine: '',
                        background: '',
                        content: '',

            function bindEditor(root) {
                // 故事级字段
                root.querySelectorAll('[data-edit]').forEach(function (el) {
                    el.addEventListener('input', function () {
                        _edit[el.getAttribute('data-edit')] = el.value;
                        saveEditVar();
                    });
                });
                // 章节字段
                var ch = _edit.chapters[_editChapter];
                root.querySelectorAll('[data-ch]').forEach(function (el) {
                    var k = el.getAttribute('data-ch');
                    var ev = (el.tagName === 'SELECT' || el.type === 'checkbox') ? 'change' : 'input';
                    el.addEventListener(ev, function () {
                        ch[k] = el.type === 'checkbox' ? el.checked : el.value;
                        saveEditVar();
                        if (k === 'content') {
                            var cnt = root.querySelector('.tf-edit-count');
                            if (cnt) {
                                var u = (el.value || '').length;
                                cnt.innerHTML = '<span>还可输入' + Math.max(0, 1500 - u) + '字</span><span>' + u + '/1500</span>';
                            }
                        }
                    });
                });
                // 章节 tab 切换/添加/删除
                root.querySelectorAll('[data-chtab]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        if (ev.target.getAttribute('data-chdel')) return;
                        _editChapter = parseInt(el.getAttribute('data-chtab'), 10);
                        renderBody();
                    });
                });
                root.querySelectorAll('[data-chdel]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        var i = parseInt(el.getAttribute('data-chdel'), 10);
                        if (_edit.chapters.length <= 1) {
                            alert('至少保留一个章节');
                            return;
                        }
                        _edit.chapters.splice(i, 1);
                        if (_editChapter >= _edit.chapters.length) _editChapter = _edit.chapters.length - 1;
                        saveEditVar();
                        renderBody();
                    });
                });
                var addBtn = root.querySelector('[data-chadd]');
                if (addBtn) addBtn.addEventListener('click', function () {
                    _edit.chapters.push({
                        title: '第 ' + (_edit.chapters.length + 1) + ' 章',
                        openingRole: '旁白',
                        openingLine: '',
                        background: '',
                        content: '',
                        successCondition: '',
                        conditionVisible: true,
                        entryCondition: '',
                        musicAutoPlay: false
                    });
                    _editChapter = _edit.chapters.length - 1;
                    saveEditVar();
                    renderBody();
                });
                // 编写说明折叠
                var helpBtn = root.querySelector('[data-helpbtn]');
                if (helpBtn) helpBtn.addEventListener('click', function () {
                    _openSections.__chHelp = !_openSections.__chHelp;
                    renderBody();
                });
                // 保存按钮（章节）
                var saveBtn = root.querySelector('[data-editsave]');
                if (saveBtn) saveBtn.addEventListener('click', function () {
                    saveEditVar();
                    if (T && T.utils) T.utils.toast('章节列表已保存到动态参数（' + _edit.chapters.length + ' 章）');
                });
                // 发布按钮（静态：简介+背景→世界书）
                var pubBtn = root.querySelector('[data-editpublish]');
                if (pubBtn) pubBtn.addEventListener('click', function () {
                    saveEditVar();
                    if (T && T.plugin) {
                        T.plugin.emit('sidebar:action', 'tf-story-publish-edit');
                    }
                });
                var cacheBtn = root.querySelector('[data-editcache]');
                if (cacheBtn) cacheBtn.addEventListener('click', function () {
                    saveEditVar();
                    if (T && T.utils) T.utils.toast('已暂存到本地变量');
                });
                // 背景图点击聚焦输入
                var bg = root.querySelector('[data-chbg]');
                if (bg) bg.addEventListener('click', function () {
                    var inp = root.querySelector('[data-ch="background"]');
                    if (inp) inp.focus();
                });
                // 群聊编排：切换即保存并应用（走 entry 的 applyOrchestrationMode）
                var orchSel = root.querySelector('[data-orch]');
                if (orchSel) orchSel.addEventListener('change', function () {
                    _edit.orchestration = orchSel.value;
                    saveEditVar();
                    if (T && T.plugin) T.plugin.emit('sidebar:action', 'tf-story-apply-mode');
                });
                var orchApply = root.querySelector('[data-orch-apply]');
                if (orchApply) orchApply.addEventListener('click', function () {
                    saveEditVar();
                    if (T && T.plugin) T.plugin.emit('sidebar:action', 'tf-story-apply-mode');
                });
                // 台词数量（数字，存为整数）
                var lc = root.querySelector('[data-linecount]');
                if (lc) lc.addEventListener('input', function () {
                    var v = parseInt(lc.value, 10);
                    if (isNaN(v) || v < 1) v = 20;
                    _edit.lineCount = v;
                    saveEditVar();
                });
                // 意图识别模式
                var im = root.querySelector('[data-intent-mode]');
                if (im) im.addEventListener('change', function () {
                    _edit.intentMode = im.value;
                    saveEditVar();
                });
                // 检测编排器插件并提示
                if (root.querySelector('#tf-orch-note')) detectStagePlugin();
            }

            /* ================= 主渲染 ================= */

                        + '<span class="tf-role-pill__name">' + esc(c.name) + '</span></div>';
                });
                h += '</div>';
                if (_story.characters[_selRole]) h += roleDetailHtml(_story.characters[_selRole]);

                h += '<div class="tf-collapse' + collapseOpen('help') + '">' + helpHtml() + '</div>';

                // --- 世界书 ---
                var wbN = ((_story.worldbook && _story.worldbook.entries) || []).length;

                h += '<div class="tf-collapse' + collapseOpen('worldbook') + '">' + worldbookHtml() + '</div>';

                // --- 当前章节事件 ---
                h += linkRowHtml('events', '当前章节事件');
                h += '<div class="tf-collapse' + collapseOpen('events') + '">' + eventsHtml() + '</div>';

                // --- 对话模式 ---
                h += linkRowHtml('mode', '对话模式', ' >');
                h += '<div class="tf-collapse' + collapseOpen('mode') + '">' + modeHtml() + '</div>';

                // --- 故事进度（章节结局判定 + 事件进度 + 自由模式状态） ---

                h += '<div class="tf-collapse' + collapseOpen('progress') + '">' + progressHtml() + '</div>';

                // --- 故事配置按钮（醒目主按钮样式，对齐 SceneCreate 底部主操作按钮） ---
                var editorOpen = !!_openSections.editor;
                h += '<button class="tf-config-btn" data-toggle="editor">'
                    + '<span class="tf-config-btn__icon">✎</span>'
                    + '<span class="tf-config-btn__label">故事配置</span>'
                    + '<span class="tf-config-btn__sub">多章节 · 全局背景 · 章节内容 · 结局条件</span>'
                    + '<span class="tf-config-btn__arrow">' + (editorOpen ? '▾' : '▸') + '</span>'
                    + '</button>';
                h += '<div class="tf-collapse' + collapseOpen('editor') + '" id="tf-editor-zone">' + editorHtml() + '</div>';

                body.innerHTML = h;

                // 章节背景图：files/... 路径异步解析为可渲染图
                resolveChapterBg(body);

                // 绑定
                body.querySelectorAll('[data-toggle]').forEach(function (el) {
                    el.addEventListener('click', function () {
                        var k = el.getAttribute('data-toggle');
                        _openSections[k] = !_openSections[k];
                        if (k === 'editor' && _openSections[k] && !_edit) loadEdit().then(renderBody);
                        else renderBody();
                    });
                });
                body.querySelectorAll('[data-role]').forEach(function (el) {
                    el.addEventListener('click', function () {
                        _selRole = parseInt(el.getAttribute('data-role'), 10);
                        renderBody();
                    });
                });
                // 角色详情折叠 + 查看原文折叠
                body.querySelectorAll('[data-role-detail]').forEach(function (el) {
                    el.addEventListener('click', function () {
                        var k = el.getAttribute('data-role-detail');
                        _openSections[k] = !_openSections[k];
                        renderBody();
                    });
                });
                // 角色配置按钮（打开弹窗，由底部 role-config IIFE 的 document listener 处理）
                // 此处不重复绑定，避免双重触发
                // LLM 配置按钮 -> 打开弹窗（modal 由底部 llm-config IIFE 处理）
                var llmOpenBtn = body.querySelector('[data-llm-open]');
                if (llmOpenBtn) {
                    llmOpenBtn.addEventListener('click', function () {
                        if (window._tfOpenLlmConfig) window._tfOpenLlmConfig();
                        else console.warn('[story_panel] _tfOpenLlmConfig not defined');
                    });
                }
                body.querySelectorAll('[data-role-raw]').forEach(function (el) {
                    el.addEventListener('click', function () {
                        var k = el.getAttribute('data-role-raw');
                        _openSections[k + '__raw'] = !_openSections[k + '__raw'];

                    });
                });
                body.querySelectorAll('[data-wb]').forEach(function (el) {

                        renderBody();
                    });
                });
                var snapBtn = body.querySelector('[data-toggle="__stateSnap"]');
                if (snapBtn) snapBtn.addEventListener('click', function () {
                    _openSections.__stateSnap = !_openSections.__stateSnap;
                    renderBody();
                });
