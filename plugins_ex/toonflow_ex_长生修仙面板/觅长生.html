<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f18">
<title>觅长生 · 手机版</title>
<style>
:root{
  --bg:#0b0f18; --bg2:#121826; --card:rgba(255,255,255,.045);
  --line:rgba(201,169,97,.28); --gold:#c9a961; --gold2:#e8cf94;
  --jade:#5fd3c0; --red:#e0604f; --purple:#a98cf0;
  --txt:#e6e3da; --dim:#8b8b96;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden}
body{
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  color:var(--txt); font-size:15px; line-height:1.6;
  display:flex; align-items:center; justify-content:center;
  user-select:none;
}
#app{
  position:relative; width:100%; max-width:460px; height:100dvh; max-height:100dvh;
  background:
    radial-gradient(1000px 500px at 50% -10%, #1c2740 0%, transparent 60%),
    linear-gradient(180deg,#0d131f 0%, #0b0f18 60%, #080b12 100%);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.8);
}
@media (min-width:520px){ #app{ height:92vh; border-radius:26px; border:1px solid rgba(201,169,97,.18)} }

.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
.card.tight{padding:11px 13px}
.ttl{font-size:13px;letter-spacing:3px;color:var(--gold);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ttl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.row .k{color:var(--dim);flex-shrink:0}
.row .v{color:var(--txt);text-align:right}
.muted{color:var(--dim);font-size:12.5px}
.gold{color:var(--gold2)} .jade{color:var(--jade)} .red{color:var(--red)} .pur{color:var(--purple)}

.btn{
  display:block;width:100%;padding:12px 14px;margin:9px 0;border-radius:12px;
  background:linear-gradient(180deg,rgba(201,169,97,.18),rgba(201,169,97,.06));
  border:1px solid var(--line);color:var(--gold2);font-size:15px;font-family:inherit;
  letter-spacing:2px;cursor:pointer;transition:transform .08s,filter .15s;
}
.btn:active{transform:scale(.975);filter:brightness(1.25)}
.btn.sm{padding:9px 12px;font-size:13.5px;letter-spacing:1px;margin:0}
.btn.jade{background:linear-gradient(180deg,rgba(95,211,192,.18),rgba(95,211,192,.05));border-color:rgba(95,211,192,.32);color:#9ff0e2}
.btn.ghost{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.12);color:#b9bcc6}
.btn:disabled{opacity:.4;filter:grayscale(.6)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.bar{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar.exp>i{background:linear-gradient(90deg,#2f7d8f,#5fd3c0)}
.bar.life>i{background:linear-gradient(90deg,#8a6a2a,#e8cf94)}
.bar.life.low>i{background:linear-gradient(90deg,#7a2a25,#e0604f)}

/* ---------- 顶部 HUD ---------- */
#hud{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(11,15,24,.96),rgba(11,15,24,.75));border-bottom:1px solid rgba(201,169,97,.14);flex-shrink:0}
.hud-top{display:flex;align-items:baseline;gap:8px}
.hud-name{font-size:17px;letter-spacing:2px;color:var(--gold2)}
.hud-realm{font-size:13px;color:var(--jade);letter-spacing:1px}
.hud-age{margin-left:auto;font-size:12.5px;color:var(--dim)}
.hud-bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.hud-lb{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:3px;letter-spacing:1px}
.hud-res{display:flex;gap:14px;margin-top:9px;font-size:12.5px;color:#c8c5bd;flex-wrap:wrap}
.hud-res span b{color:var(--gold2);font-weight:400}

/* ---------- 主内容 ---------- */
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(80px + env(safe-area-inset-bottom))}
#view::-webkit-scrollbar{width:0}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;display:flex;
  background:rgba(9,12,20,.97);border-top:1px solid rgba(201,169,97,.16);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px);z-index:20
}
.tab{flex:1;padding:9px 0 8px;text-align:center;color:#6f7382;font-size:11.5px;letter-spacing:1px;cursor:pointer}
.tab .ic{display:block;font-size:19px;line-height:1.3;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--gold2)}
.tab.on .ic{filter:none;opacity:1;text-shadow:0 0 12px rgba(201,169,97,.55)}

/* ---------- 日志 ---------- */
#log{font-size:13px;line-height:1.75;color:#a9a89f}
#log p{margin:0 0 7px;padding-left:11px;border-left:2px solid rgba(201,169,97,.25);animation:fade .35s}
#log p.good{border-color:rgba(95,211,192,.6);color:#9ff0e2}
#log p.bad{border-color:rgba(224,96,79,.6);color:#f0a89c}
#log p.big{border-color:var(--gold);color:var(--gold2);letter-spacing:1px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 开局 ---------- */
#screen-create{padding:calc(env(safe-area-inset-top) + 22px) 22px 22px;overflow-y:auto}
.logo{text-align:center;margin:14px 0 6px}
.logo h1{font-size:34px;letter-spacing:12px;margin:0;color:var(--gold2);text-shadow:0 0 26px rgba(201,169,97,.4);font-weight:400}
.logo p{margin:6px 0 0;font-size:12px;letter-spacing:6px;color:#6d7488}
.roll{text-align:center;padding:22px 0}
.roll .el{font-size:44px;letter-spacing:6px;color:var(--gold2);text-shadow:0 0 30px rgba(201,169,97,.5)}
.roll .sc{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:2px}
/* ---------- 开局选项 ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row5{grid-template-columns:repeat(5,1fr);display:grid;gap:6px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--txt);font-family:inherit;font-size:14px;position:relative;transition:.15s}
.opt .od{display:block;font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5;letter-spacing:.5px}
.opt.on{border-color:var(--gold);background:rgba(201,169,97,.12);color:var(--gold2);box-shadow:0 0 14px rgba(201,169,97,.18)}
.opt.on .od{color:#c9b98a}
.pt{position:absolute;top:9px;right:10px;font-size:11px;color:var(--jade);background:rgba(95,211,192,.12);border-radius:8px;padding:1px 7px}
.pt.neg{color:#f0a89c;background:rgba(224,96,79,.14)}
.sub{font-size:12px;color:var(--dim);margin:12px 0 6px;letter-spacing:1px}
.ptbar{position:sticky;bottom:0}
.ptrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}
.ptrow b{font-size:17px}

/* ---------- toast / modal ---------- */
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:86%;max-width:380px}
.tst{background:rgba(14,19,30,.96);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:13.5px;text-align:center;animation:tin .3s;box-shadow:0 8px 26px rgba(0,0,0,.55)}
.tst.good{border-color:rgba(95,211,192,.55);color:#9ff0e2}
.tst.bad{border-color:rgba(224,96,79,.55);color:#f0a89c}
.tst.big{border-color:var(--gold);color:var(--gold2);letter-spacing:2px;font-size:15px}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}

#modal{position:absolute;inset:0;z-index:100;background:rgba(4,6,11,.82);display:flex;align-items:center;justify-content:center;padding:26px;backdrop-filter:blur(3px)}
#modal .box{width:100%;max-height:76%;overflow-y:auto;background:linear-gradient(180deg,#141b2a,#0e131e);border:1px solid var(--line);border-radius:18px;padding:20px 18px;animation:min .28s}
@keyframes min{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#modal h3{margin:0 0 12px;font-size:17px;letter-spacing:3px;color:var(--gold2);text-align:center;font-weight:400}
#modal .body{font-size:14px;line-height:1.85;color:#c9c6bd}

.chip{display:inline-block;padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.14);font-size:11.5px;margin:3px 5px 3px 0;color:#b6b3aa}
.chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,169,97,.1)}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.07);font-size:13.5px}
.item-row:last-child{border:0}

/* ---------- 战斗 ---------- */
#battle{position:absolute;inset:0;z-index:120;background:linear-gradient(180deg,#0a0e16,#0b0f18);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;gap:8px}
#battle .side-h{display:flex;align-items:baseline;gap:8px;font-size:15px;letter-spacing:1px}
#battle .el-tag{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid currentColor}
#battle .hpt{font-size:11.5px;color:var(--dim);margin-top:3px;text-align:right}
#battle .st-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;min-height:16px}
#battle .st{font-size:11px;padding:1px 7px;border-radius:10px}
#battle .st.burn{color:#f08a6f;border:1px solid #f08a6f66}
#battle .st.vuln{color:#e0604f;border:1px solid #e0604f66}
#battle .st.armor{color:#9ff0e2;border:1px solid #9ff0e266}
#battle #b-enemy{padding:10px 12px;background:rgba(224,96,79,.06);border:1px solid rgba(224,96,79,.22);border-radius:12px;flex-shrink:0}
#battle #b-me{padding:10px 12px;background:rgba(95,211,192,.05);border:1px solid rgba(95,211,192,.2);border-radius:12px;flex-shrink:0}
#battle .qi-row{display:flex;gap:6px;margin-top:8px}
#battle .qi{font-size:11.5px;padding:3px 8px;border-radius:9px;border:1px solid;opacity:.32}
#battle .qi.on{opacity:1}
#battle .qi b{margin-left:4px;font-weight:400}
#battle #b-log{flex:1;overflow-y:auto;font-size:12.5px;line-height:1.7;color:#bdbab2;padding:4px 2px}
#battle #b-log .bl{border-left:2px solid rgba(201,169,97,.2);padding-left:8px;margin-bottom:5px;animation:fade .3s}
#battle #b-log .bl.bad{border-color:rgba(224,96,79,.5);color:#f0a89c}
#battle #b-log .bl.big{border-color:var(--gold);color:var(--gold2)}
#battle #b-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;max-height:44%;overflow-y:auto;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#battle .bcard{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:9px 5px;text-align:center;color:var(--txt);font-family:inherit;cursor:pointer;transition:filter .12s}
#battle .bcard:active{filter:brightness(1.35)}
#battle .bcard.dis{opacity:.32}
#battle .bcard .bn{font-size:13px;color:var(--gold2);letter-spacing:1px}
#battle .bcard .bc{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.3}
#battle .bcard .cd{font-size:9px;color:#e0604f;border:1px solid #e0604f66;border-radius:6px;padding:0 4px}
#battle .bcard.el-jin{border-color:#e8cf9466}#battle .bcard.el-mu{border-color:#7fd48a66}#battle .bcard.el-shui{border-color:#6fc3f066}#battle .bcard.el-huo{border-color:#f08a6f66}#battle .bcard.el-tu{border-color:#d8b87866}
#battle .bcard.flee{grid-column:span 3;background:rgba(224,96,79,.08);border-color:rgba(224,96,79,.3);color:#f0a89c;letter-spacing:3px;padding:10px}
#battle .b-acts{display:flex;gap:6px;margin-bottom:8px}
#battle .bact{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:9px 4px;color:var(--txt);font-family:inherit;font-size:12.5px;cursor:pointer;letter-spacing:1px}
#battle .bact.xue{color:#f0a89c;border-color:rgba(224,96,79,.4);background:rgba(224,96,79,.08)}
#battle .bact:active{filter:brightness(1.3)}
#battle .bcard.t-shen{border-color:#a98bd6}
#battle .bcard.t-shen .bn{color:#c9b3ec}
.bitem-hd{font-size:13px;color:var(--gold2);margin:2px 0 8px;letter-spacing:1px}
.st.freeze{color:#6fc3f0;border:1px solid #6fc3f066}
</style>
</head>
<body>
<div id="app">

  <!-- ========== 开局：捏脸/抽灵根 ========== -->
  <section id="screen-create" class="screen">
    <div class="logo">
      <h1>觅长生</h1>
      <p>手 机 版 · 修 仙 一 生</p>
    </div>

    <div class="card">
      <div class="ttl">道号</div>
      <input id="in-name" maxlength="6" placeholder="为自己取一个道号"
        style="width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--txt);font-family:inherit;font-size:16px;letter-spacing:3px;text-align:center;outline:none">
      <div class="grid3" style="margin-top:10px">
        <button class="btn sm ghost" onclick="document.getElementById('in-name').value=randName();document.getElementById('in-name').dispatchEvent(new Event('input'))">随机</button>
        <button class="btn sm ghost" onclick="S.gender='男';renderCreate()">♂ 男修</button>
        <button class="btn sm ghost" onclick="S.gender='女';renderCreate()">♀ 女修</button>
      </div>
    </div>

    <div class="card">
      <div class="ttl">灵根 · 自择</div>
      <div class="roll">
        <div class="el" id="el-root">— — —</div>
        <div class="sc" id="el-desc">原版开局为天赋点分配，自行择定灵根与根基</div>
      </div>
    </div>

    <div id="create-body"></div>

    <div class="card ptbar" id="pt-bar"></div>

    <div class="card" id="card-start" style="display:none">
      <div class="ttl">命数</div>
      <div id="start-info" class="muted" style="line-height:2"></div>
      <button class="btn" style="margin-top:12px" onclick="startGame()">入 仙 途</button>
    </div>

    <div class="muted" style="text-align:center;margin:16px 0 30px;font-size:11.5px;line-height:1.9">
      寿元有尽，大道无穷。<br>此生若未能长生，来世重修，道行不灭。
    </div>
  </section>

  <!-- ========== 主界面 ========== -->
  <div id="screen-main" class="screen hidden">
    <header id="hud">
      <div class="hud-top">
        <span class="hud-name" id="h-name">—</span>
        <span class="hud-realm" id="h-realm">—</span>
        <span class="hud-age" id="h-age">—</span>
      </div>
      <div class="hud-bars">
        <div>
          <div class="hud-lb"><span>修为</span><span id="h-exp-t">0/0</span></div>
          <div class="bar exp"><i id="h-exp" style="width:0%"></i></div>
        </div>
        <div>
          <div class="hud-lb"><span>寿元</span><span id="h-life-t">0/0</span></div>
          <div class="bar life" id="h-life-bar"><i id="h-life" style="width:100%"></i></div>
        </div>
      </div>
      <div class="hud-res">
        <span>灵石 <b id="h-stone">0</b></span>
        <span>战力 <b id="h-atk">0</b></span>
        <span>神识 <b id="h-mind">0</b></span>
        <span>传承 <b id="h-legacy">0</b></span>
      </div>
    </header>

    <main id="view"></main>

    <nav id="tabbar">
      <div class="tab on" data-tab="home" onclick="go('home')"><span class="ic">☯</span>洞府</div>
      <div class="tab" data-tab="train" onclick="go('train')"><span class="ic">⚔</span>历练</div>
      <div class="tab" data-tab="pill" onclick="go('pill')"><span class="ic">⚱</span>丹房</div>
      <div class="tab" data-tab="shop" onclick="go('shop')"><span class="ic">⌘</span>坊市</div>
      <div class="tab" data-tab="jh" onclick="go('jh')"><span class="ic">⚑</span>江湖</div>
      <div class="tab" data-tab="dex" onclick="go('dex')"><span class="ic">⛩</span>图鉴</div>
      <div class="tab" data-tab="more" onclick="go('more')"><span class="ic">☰</span>道途</div>
    </nav>
  </div>

  <div id="toast"></div>

  <!-- ========== 战斗（卡牌式回合制 · 五行灵气）========== -->
  <div id="battle" class="hidden">
    <div id="b-enemy"></div>
    <div id="b-log"></div>
    <div id="b-me"></div>
    <div id="b-cards"></div>
  </div>
</div>

<script>
/* ============================================================
   觅长生 · 手机版  —— 单文件修仙放置/文字冒险
   ============================================================ */
/* ---------------- 工具 ---------------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.round(n);if(n>=1e8)return (n/1e8).toFixed(2)+'亿';if(n>=1e4)return (n/1e4).toFixed(2)+'万';return ''+n};

/* ---------------- 五行 / 灵根 ---------------- */
const ELN={jin:'金',mu:'木',shui:'水',huo:'火',tu:'土'};
const ELC={jin:'#e8cf94',mu:'#7fd48a',shui:'#6fc3f0',huo:'#f08a6f',tu:'#d8b878'};
const ELS=['jin','mu','shui','huo','tu'];
const ROOTS=[
  {n:'天灵根',   c:1.65, d:'万中无一，修炼一日千里'},
  {n:'变异灵根', c:1.42, d:'两系相生，罕见异象'},
  {n:'双灵根',   c:1.24, d:'上乘之资，门派必争'},
  {n:'三灵根',   c:1.02, d:'中规中矩，勤能补拙'},
  {n:'四灵根',   c:0.86, d:'略有驳杂，进境迟缓'},
  {n:'五灵根',   c:0.70, d:'杂灵根，仙途艰难'},
];

/* ---------------- 境界 ---------------- */
const REALMS=[
 {n:'练气',life:70,  subs:['一层','二层','三层','四层','五层','六层','七层','八层','九层','十层','十一层','十二层','十三层']},
 {n:'筑基',life:100, subs:['初期','中期','后期','大圆满']},
 {n:'金丹',life:135, subs:['初期','中期','后期','大圆满']},
 {n:'元婴',life:170, subs:['初期','中期','后期','大圆满']},
 {n:'化神',life:215, subs:['初期','中期','后期','大圆满']},
 {n:'炼虚',life:270, subs:['初期','中期','后期','大圆满']},
 {n:'合体',life:330, subs:['初期','中期','后期','大圆满']},
 {n:'大乘',life:400, subs:['初期','中期','后期','大圆满']},
 {n:'渡劫',life:500, subs:['初期','中期','后期','大圆满']},
 {n:'真仙',life:99999,subs:['地仙','金仙']},
];
const LV=[];
REALMS.forEach((r,ri)=>r.subs.forEach((s,si)=>LV.push({ri,si,name:r.n+s,realm:r.n,sub:s,life:r.life})));
const MAXLV=LV.length-1;
const needExp=i=>Math.round(180*Math.pow(1.26,i));      // 升到 i+1 所需修为
const isBigStep=i=>(i<MAXLV)&&(LV[i+1].ri>LV[i].ri);    // 大境界跨越
function realmName(i){return LV[i].name}
function ageStr(a){const y=Math.floor(a),m=Math.round((a-y)*12);return y+'岁'+(m>0?m+'月':'')}

 {k:'yanxiao',n:'炎萧',role:'离火门大师兄',place:'沃焦山',lv:12,
  desc:'年轻一辈三大天才之一，性烈如火。焱峰上那个内鬼，是他最先察觉的。'},
 {k:'henghuo',n:'恒火真君',role:'离火门掌门',place:'沃焦山',lv:22,
  desc:'离火门掌门。数百年前古神教安插的内鬼，就藏在他门中。'},
 {k:'dantaixian',n:'澹台仙',role:'化尘教首席弟子',place:'正阳山',lv:13,
  desc:'化尘教首席，沉默寡言。正阳兽潮那年，是他守的山门。'},
 {k:'liqinglin',n:'李青麟',role:'竹山宗首席弟子',place:'方壶山',lv:11,
  desc:'竹山首席，天魔眼猎魔试炼里出了名的狠角色。'},
 {k:'mingshan',n:'明山散人',role:'竹山宗太上长老',place:'方壶山长老洞府',lv:27,
  desc:'化神期大能，五大派中唯一坐镇者。关于飞升，他知道的比谁都多。'},
 {k:'weiwuji',n:'魏无极',role:'御剑门遗孤',place:'九嶷山',lv:20,
  desc:'守着御剑门遗迹的人。九转游身剑与长生诀的来龙去脉，都系在他身上。'},
 {k:'fanjiu',n:'范杰',role:'天机阁阁主',place:'天衍阁',lv:20,
  desc:'元婴巅峰的富商阁主，主办天机大比。天衍阁里六品材料堆积如山。'},
 {k:'mojuren',n:'墨居仁',role:'离火门内鬼',place:'沃焦山焱峰',lv:18,
  desc:'古神教安插在离火门的内鬼，藏着一块灿字牌。'},
 {k:'heixin',n:'黑心老人',role:'魔道巨擘',place:'九嶷山破庙',lv:24,
  desc:'九嶷山破庙中与天邪子相争之人。帮谁，都是一场因果。'},
 {k:'tianxiezi',n:'天邪子',role:'古神教',place:'九嶷山破庙',lv:24,
  desc:'古神教高手，在破庙里与人相争。胜他可得一部邪门功法。'},
 {k:'xuewei',n:'血薇仙子',role:'血剑宫',place:'雍州',lv:26,
  desc:'血剑宫化神。魔门入侵那一年，白帝楼下的血，多半是她放的。'},
 {k:'xuehe',n:'血河老祖',role:'血剑宫',place:'雍州',lv:25,
  desc:'剑碧通落一战中守着最后一条线索的人。败他，御剑门真相才见天日。'},
 {k:'kumu',n:'枯木长老',role:'竹山宗长老',place:'方壶山枯木林',lv:21,
  desc:'与天魔道勾结的竹山长老。求援之役中，明山散人亲自处置了他。'},
 {k:'malaoliu',n:'麻老九',role:'禾山道',place:'禾山',lv:7,
  desc:'禾山道的地头蛇，欺负散修、拐带村民，坏事做尽。'},
 {k:'dulaoer',n:'杜老二',role:'沂山派',place:'沂山',lv:7,
  desc:'沂山派的打手头目，当年围攻倪旭欣的就有他一份。'},
 {k:'yanling',n:'炎麟大圣',role:'麟庙之主·化神妖圣',place:'沃焦山麟庙',lv:26,
  desc:'化神期的妖圣，魔焰真君的至交。麟庙中人，都敬它三分。'},
];
function npcPow(n){return Math.round(60*Math.pow(1.42,n.lv)*1.3)}

/* ---------------- 主线剧情 ---------------- */
const STORY=[
{id:'xiujian',t:'溪边锈剑',year:0,lv:0,need:null,
 txt:'十六岁那年，你在武陵城外的溪涧边捡到一柄锈迹斑斑的钝剑。指腹刚触到剑柄，一道苍老的声音便在识海中响起：「小子……多少年了，终于又有人拿起这柄剑。」',
 opts:[
  {t:'细问他的来历',e:{item:'w_xiujian',flag:'changsheng'},r:'剑灵说他只剩一缕残魂，只记得自己曾守过一座剑门。他许诺教你一门养剑的古法——长生诀。'},
  {t:'握紧剑柄，静观其变',e:{item:'w_xiujian',exp:0.15},r:'一股凉意顺着手臂爬上心口。老者沉默良久，叹道：「罢了，来日方长。」他不再说话，却在你体内留下了一缕剑气。'},
  {t:'锈剑换酒钱算了',e:{stone:300},r:'你把锈剑卖给了镇上的铁匠，换了三百灵石。夜里，识海中再没有声音。你翻了个身，睡得很沉。'},
 ]},
{id:'nixuxin',t:'初遇倪旭欣',year:0,lv:2,need:null,
 txt:'出城数十里，三名沂山派修士正围着一个锦衣少年。少年背靠枯树，衣袍已被血浸透，却仍咬着牙不肯交出腰间的玉牌。',
 opts:[
  {t:'拔剑相助',e:{like:{nixuxin:30},injury:1},r:'你一剑逼退三人。少年愣了愣，抱着拳说：「武陵城倪家，倪旭欣。这份恩情，我记下了。」你肩上添了一道口子，却觉得值。'},
  {t:'先看看再说',e:{like:{nixuxin:5},mind:2},r:'你藏在树后看完了整场。沂山派的人抢走玉牌扬长而去，少年瘫坐在地，眼里全是不甘。你记住了那几个人的模样。'},
  {t:'趁乱捞一笔',e:{stone:500,like:{nixuxin:-10}},r:'你等两败俱伤才出手，捡走了散落的储物袋。少年躺在地上看着你，什么也没说。那眼神你记了一辈子。'},
 ]},
{id:'dongshigu',t:'东石谷仙师集会',year:0,lv:0,need:'nixuxin',
 txt:'倪旭欣派人送来请帖：正月的东石谷仙师集会，宁州散修云集，二月伴月楼还有一场拍卖会。青羽门的执事正在谷口收入场费——十块灵石。',
 opts:[
  {t:'交灵石入场',e:{stone:-10,mind:3,herb:['h1','h2','h3']},r:'谷中热闹非凡。你与各方散修论道换帖，听了不少秘境传闻，还换回几株灵草。'},
  {t:'翻墙进去',e:{mind:2,stone:200,demon:1},r:'你绕到后山翻进谷中，省下十块灵石，却听得不踏实。中途还顺了摊主两颗灵石——道心上，终究落了点灰。'},
  {t:'在谷外摆摊',e:{stone:600},r:'你在谷口支了个摊，卖自制的符纸与灵草。三日后收摊，竟比进去听会赚得还多。'},
 ]},
{id:'yingjie',t:'升仙台·英杰会',year:0,lv:6,need:'dongshigu',
 txt:'武陵城升仙台，五年一届的英杰会。台下人头攒动，规则简单：四十岁以下的练气修士皆可上台，最后站着的那位，得一枚筑基丹，并可入白帝楼。',
 opts:[
  {t:'登台',e:{pill:'p_zhu',like:{bailiqi:20,baidi:10},injury:1},r:'你一路打到决赛，最后败给了广陵城来的百里奇——不，是他的剑慢了半分。他笑着把筑基丹推给你：「这枚丹，该你的。」台上的白帝多看了你一眼。'},
  {t:'在台下观战',e:{mind:4,stone:300},r:'你站在人群里看完了整场。台上那些剑招你记了个七七八八，散场时还顺手赢了点赌注。'},
  {t:'先去别处历练',e:{exp:0.25},r:'你转身出了城。升仙台上的喧嚣留在身后，你在山里闭关数月，倒也安稳。'},
 ]},
{id:'rumen',t:'拜入仙门',year:0,lv:4,need:'yingjie',
 txt:'倪府管家杨易把宁州五大派的门道一一说给你听：竹山宗在方壶山，金虹剑派在连石山，星河剑派在风雷谷只收女修，离火门在沃焦山来者不拒，化尘教在正阳山，第五年才开山门。',
 opts:[
  {t:'去方壶山（竹山宗）',e:{sect:'zhushan'},r:'你在擂台上连胜三人，竹山宗收下了你。紫菱仙子递来一册《青木长生功》。'},
  {t:'去连石山（金虹剑派）',e:{sect:'jinhong'},r:'萧千绝上下打量你一番，丢来一件道袍：「悟性还行，跟我走。」'},
  {t:'去风雷谷（星河剑派）',e:{sect:'xinghe'},r:'你用了二十七日走过三路剑阵。慕容颖在尽头等你：「从今日起，你是星河的人。」'},
  {t:'去沃焦山（离火门）',e:{sect:'lihuo'},r:'离火门不挑人。炎萧往你手里塞了枚火晶：「炼化了，就算入了门。」'},
  {t:'不入宗门，做散修',e:{stone:800,mind:2},r:'你谢过杨管家，转身走出了武陵城。散修自在，只是风雨都要自己扛。'},
 ]},
{id:'jianling',t:'狂暴的剑灵',year:0,lv:5,need:'rumen',
 txt:'大地图上一柄飞剑横冲直撞，剑气所过之处树木尽折。倪府管家认出那是御剑门的路数，让你去九嶷山走一趟。御剑门早已灭门——因"私通魔门"，被五大派合力围剿。',
 opts:[
  {t:'去九嶷山一探究竟',e:{flag:'jiuyi',item:'w_jiuzhuan',exp:0.5},r:'养剑池底沉着那柄神秘铁剑，藏经阁的残卷里你悟出九转游身剑。老者的记忆复苏了一角——那是长生诀的真正开篇。'},
  {t:'先把消息告诉师门',e:{mind:5,stone:1200,like:{nixuxin:10}},r:'你把飞剑之事报给师门，得了赏赐。九嶷山的秘密，暂时还躺在原地等你。'},
  {t:'置之不理',e:{exp:0.2},r:'你绕开了那柄飞剑。它撞在山壁上，碎成了一地铁屑。'},
 ]},
{id:'daxie',t:'倪府答谢宴',year:0,lv:6,need:'nixuxin',
 txt:'倪振东设宴答谢救子之恩。酒过三巡，他忽然问起你腰间那柄锈剑的来历。你刚要开口，剑身嗡鸣，一道剑气将你击晕。醒来时，枕边放着一千五百块灵石。',
 opts:[
  {t:'收下灵石，闭口不问',e:{stone:1500,like:{nizhendong:15}},r:'你收下灵石，从此不再提锈剑的事。倪振东看你的眼神里，多了一分说不清的东西。'},
  {t:'当面追问锈剑来历',e:{like:{nixuxin:25,nizhendong:-5},mind:6,demon:1},r:'倪振东沉默良久，只说了一句：「御剑门的剑，不该再出现在宁州。」你听出了别的东西——不只是忌惮，还有旧情。'},
 ]},
{id:'ningwang',t:'宁王府',year:1,lv:13,need:'rumen',
 txt:'逸风城擂台上的武道会年年不休，今年的魁首被宁王亲自召见。你循着线索潜入王府，在后堂听见了不该听的话——宁王与天魔道，已经勾结多年。',
 opts:[
  {t:'潜入取证',e:{flag:'qicheng',injury:1,mind:5},r:'你带出了那封密信，也带出了一身伤。宁州五大派自此知道：宁王府，是魔门在宁州的根。作为报偿，你得到一部全天下仅此一本的《气沉丹田》。'},
  {t:'直接上报师门',e:{stone:3000,mind:3,like:{nixuxin:10}},r:'你把消息交给师门，长老们自会处置。赏赐下来，你一分没留，全都换成了修炼所需。'},
  {t:'睁一只眼闭一只眼',e:{stone:2000,demon:2},r:'宁王的管家塞给你两千灵石。你收下了，那封密信还留在原位。夜里，你做了个很长的噩梦。'},
 ]},
{id:'wushan',t:'巫山魔影',year:7,lv:13,need:'ningwang',
 txt:'第七年，巫山脚下的村人接连失踪。山洞深处魔气翻涌，洞口石壁上刻着一枚熟悉的印记——与当年御剑门被指"私通魔门"时，那些人身上的一样。',
 opts:[
  {t:'入洞除魔',e:{exp:0.35,injury:1,herb:['h7','h3']},r:'洞窟深处的魔物被你一剑斩灭。石壁上的印记被你拓了下来——它会是日后揭开御剑门真相的线索之一。'},
  {t:'请师门同往',e:{exp:0.3,mind:4,stone:2000},r:'你带了两位同门前来。魔影散去，功劳记在门中，你落得一份安稳。'},
  {t:'避而远之',e:{demon:1},r:'你没有进洞。那年冬天，巫山脚下再没有人家。'},
 ]},
{id:'canzipai',t:'灿字牌',year:30,lv:13,need:'wushan',
 txt:'第三十年，沃焦山焱峰。离火门弟子墨居仁腰间那块灿字牌，与古神教的记号分毫不差。数百年前，古神教便已开始向离火门安插内鬼。',
 opts:[
  {t:'当众揭穿',e:{flag:'canzi',injury:1,stone:5000,like:{yanxiao:20,henghuo:15}},r:'你在焱峰击败墨居仁，坐实了古神教的图谋。恒火真君的脸色很难看，但还是把那枚麒麟玉塞进了你手里。'},
  {t:'私下要挟',e:{stone:12000,demon:2,like:{henghuo:-10}},r:'你没有声张，只是让墨居仁知道你掌握了什么。此后每年，他都会"孝敬"你一笔灵石——直到他被门中清理。'},
  {t:'交给炎萧处理',e:{exp:0.25,like:{yanxiao:25}},r:'你把证据交给了炎萧。他处理得干净利落，也记住了你这个人情。'},
 ]},
{id:'yujian',t:'御剑门之谜',year:60,lv:17,need:'jianling',
 txt:'金丹之后，你开始追查御剑门的旧案。七条线索散在倪府管家、公孙季与五大派长老手中。最后一条，在剑碧通落——血河老祖守在那里。',
 opts:[
  {t:'一一追问，再战血河',e:{flag:'yujian',injury:2,item:'w_zhuxian',like:{weiwuji:30,lingwuzhenren:15}},
   r:'七条线索拼齐：御剑门并未私通魔门，遗迹中的封印阵法，实为吸收魔气之用。当年五大派围攻，是被魔门利用了。血河老祖败在你剑下，真相终见天日。'},
  {t:'只查线索，不与人争',e:{flag:'yujian',mind:12,like:{gongsunji:20}},
   r:'你花了许多年，把七条线索一一问到手，却没有踏上剑碧通落。真相写在纸上，血河老祖还活着——但你活得更久。'},
  {t:'把此事彻底放下',e:{exp:0.3,demon:1},r:'人死灯灭，一门兴衰与你何干？你把卷宗烧了，转身闭关。'},
 ]},
{id:'moru',t:'魔门入侵',year:78,lv:17,need:'yujian',
 txt:'血剑宫大举来犯，白帝楼首当其冲。你赶回武陵城时，城下的血已经流成了河。一名重伤的金丹修士拦住了你——他背后，是白帝楼的门。',
 opts:[
  {t:'死战不退',e:{injury:2,exp:0.5,like:{baidi:40,nizhendong:20},flag:'moru'},
   r:'你守住了白帝楼的门。白帝从楼上走下来，只说了一句：「御剑门的剑，原来还在这里。」'},
  {t:'护送城中凡人撤退',e:{mind:10,life:20,like:{nixuxin:30}},r:'你没有留在城下。那一日你护着三千凡人撤出武陵城，回望时，白帝楼仍立着。有些仗，不在城下打。'},
  {t:'趁乱取利',e:{stone:60000,demon:3,like:{baidi:-30}},r:'你在废墟里捡走了不少东西。多年后有人提起那一战，会说到白帝楼下的血，也会说到你。'},
 ]},
{id:'hanxu',t:'涵虚仙府',year:120,lv:17,need:'moru',
 txt:'云汐城左近，涵虚仙府现世。入口处的禁制认玉不认人——一仙道人卖给你的那块破碎玉佩，此时正微微发烫。',
 opts:[
  {t:'入府闯三阵',need:'p_pei',e:{flag:'fenshen',exp:0.6,pill:'p_xu',item:'w_shan'},
   r:'天、地、人三阵一一闯过。你没能拿到道源丹，却得了一部结婴秘术分神术、一枚太虚还魂丹，还有一柄山河扇。'},
  {t:'把玉佩让给倪旭欣',e:{like:{nixuxin:60},stone:20000,mind:8},
   r:'你把玉佩塞给了老友。他在府中得了天大的机缘，出来后什么也没说，只是重重抱了抱你。'},
  {t:'在府外守候',e:{exp:0.35,herb:['h9','h8','h8']},r:'你没有进去。仙府关闭前的最后几日，山门外散落的灵药，够你用上百年。'},
 ]},
{id:'tianji',t:'天机大比',year:50,lv:21,need:'canzipai',
 txt:'天衍阁的天机大比，纯比武，禁装备、禁丹药。阁主范杰坐在高台上，笑眯眯地看着台下元婴修士们互相放倒。',
 opts:[
  {t:'一路打到夺魁',e:{flag:'taixu',mind:20,demon:-3,stone:100000},
   r:'你赢了。高台之上，范杰亲自为你挂上那枚玉牌。闭幕之后，你在天衍阁顶坐了七日——太虚境的感悟涌上来，心境大涨，心魔尽消。'},
  {t:'打一场就走',e:{stone:20000,mind:6,like:{fanjiu:15}},r:'你赢了两场便弃权。范杰有些遗憾，还是把赏钱给了你。'},
  {t:'只做看客',e:{mind:4},r:'你在台下看了整整一月。别人的道，看明白了，也是自己的。'},
 ]},
{id:'guji',t:'宁州古迹',year:500,lv:25,need:'yujian',
 txt:'第五百年，岫络谷裂开一道空间裂隙。古战场、古原城、剑魂冢……登仙殿中藏着一部《玄清天衍录》，而剑魂冢里，恒如真人正等着你。',
 opts:[
  {t:'登仙殿取书',e:{flag:'xuanqing',mind:40,exp:0.5},

 if(e.tong)S.tong=(S.tong||0)+e.tong;
 if(e.wuchi)S.wuchi=1;

 if(e.daoBr)S.daoBr=(S.daoBr||0)+e.daoBr;

 if(e.plant)S.plant=1;
 if(e.waste)S.waste=1;

 const ch=CHILDHOOD.find(x=>x.k===C.child);if(ch)effApply(ch.eff);
 const yo=YOUTH.find(x=>x.k===C.youth);if(yo)effApply(yo.eff);
 if(S.dao1000)S.mind+=S.dao1000;
}
function has(k){return (k in (S.bag||{})) || (k in S.arts) || (k in S.wps)}
function fl(k){return S.flags&&S.flags[k]?1:0}
function like(k){return (S.likes&&S.likes[k])||0}
function addLike(k,n){S.likes=S.likes||{};S.likes[k]=clamp((S.likes[k]||0)+n,-50,100);if(S.likes[k]<0)delete S.likes[k]}
function addItem(k,n){S.bag[k]=(S.bag[k]||0)+n}
function takeItem(k,n){S.bag[k]=(S.bag[k]||0)-n;if(S.bag[k]<=0)delete S.bag[k]}
function count(k){return S.bag[k]||0}

function save(){try{localStorage.setItem(SAVEKEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVEKEY);return s?JSON.parse(s):null}catch(e){return null}}

/* ---------------- 数值 ---------------- */
function artBonus(){
  const a=ITEMS[S.art]; if(!a) return 1;
  let b=1+(10-a.rank)*0.09;
  if(a.el&&S.roots.includes(a.el)) b+=0.25;
  if(!a.el&&S.roots.length>=4) b+=0.2;
  return b;
}
function artDesc(){const a=ITEMS[S.art];return a?a.n+'（'+a.rank+'品'+(a.el?ELN[a.el]+'系':'通用')+'）':'无'}
function fuBonus(){return S.wps&&S.wps.w_fu?0.3:0}
function sectBonus(){
  if(!S.sect)return 1;
  const s=SECTS.find(x=>x.k===S.sect);if(!s)return 1;
  let b=1.06;                                  // 宗门资源
  const a=ITEMS[S.art];
  if(a&&a.el&&a.el===s.el)b+=0.08;             // 功法与山门同属
  return b;
}
function gainPerMonth(){
  const base=16*Math.pow(1.155,S.lv);
  let g=base*S.rootC*artBonus()*(1+fuBonus())*(0.88+Math.random()*0.28)*sectBonus();
  g*=1+fl('changsheng')*0.12+fl('qicheng')*0.08+fl('taixu')*0.05;
  g*=(1-S.injury*0.18);
  g*=S.apt/85;
  g*=(S.spdMul||1);
  return g;
}
function power(){
  let p=60*Math.pow(1.42,S.lv);
  const a=ITEMS[S.art]; if(a) p*=1+(10-a.rank)*0.05;
  if(S.wp&&ITEMS[S.wp]) p+=ITEMS[S.wp].atk;
  p+=S.mind*0.8*(1+fl('xuanqing'));
  p*=1+fl('canzi')*0.05+fl('jiantong')*0.2;
  p*=(1-S.injury*0.2);
  return Math.round(p);
}
function breakRate(){
  let r=0.58+S.apt/100*0.22+S.legacy*0.004+(S.tena||0);
  if(!isBigStep(S.lv)) r+=0.28; else r-=0.04;
  r-=S.demon*0.04;
  r-=S.injury*0.04;
  r-=Math.min(0.25,REALMS[LV[S.lv].ri].n==='真仙'?0:0.008*S.lv);
  if(S.bag.p_zhang>0) r+=0.25;
  const big=isBigStep(S.lv);
  if(big){const map={筑基:'p_zhu',金丹:'p_jin',元婴:'p_ying',化神:'p_shen'};const k=map[LV[S.lv+1]?.realm];if(k&&S.bag[k]>0)r+=0.35}
  r+=fl('fenshen')*0.08+fl('taixu')*0.03;
  return clamp(r,0.08,0.97);
}

/* ---------------- 行动 ---------------- */
function gainExp(n){S.exp+=n}
function log(t,c){S.log.unshift({t,c:c||''});if(S.log.length>80)S.log.pop()}

function advance(months){
  for(let i=0;i<months;i++){
    S.months++; S.age+=1/12; S.lifeLeft-=1/12;
    if(S.lifeLeft<=0){S.lifeLeft=0;die('寿元耗尽，寿终正寝');return false}
  }
  return true;
}

function cultivate(months){
  let got=0,breakEv=null;
  for(let i=0;i<months;i++){
    if(!advance(1)) return;
    got+=gainPerMonth();
    if(Math.random()<(S.demon>=4?0.003:0.007)&&S.demon<6){S.demon++;breakEv='心魔滋生'}
  }
  gainExp(got);
  if(S.daoMul)S.mind+=Math.round(got*0.0016*(1+S.daoMul));
  log('静心打坐 '+months+' 月，修为 +'+fmt(got),'good');
  if(breakEv) {log(breakEv+'，道心蒙尘','bad');toast('心魔 +1','bad')}
  afterAction();
}

function calm(){
  if(!advance(6))return;
  S.demon=Math.max(0,S.demon-1);
  S.injury=Math.max(0,S.injury-1);
  log('静心调息半载，心魔渐消，伤势好转','good');
  toast('心魔 -1，伤势 -1','good');
  afterAction();
}

function breakthrough(){
  const need=needExp(S.lv);
  if(S.lv>=MAXLV){toast('已臻至道，无可再进','big');return}
  if(S.exp<need){toast('修为不足，尚需 '+fmt(need-S.exp),'bad');return}
  const rate=breakRate(),big=isBigStep(S.lv);
  const used=[];
  if(S.bag.p_zhang>0){takeItem('p_zhang',1);used.push('破障丹')}
  const map={筑基:'p_zhu',金丹:'p_jin',元婴:'p_ying',化神:'p_shen'};
  const nb=LV[S.lv+1]?map[LV[S.lv+1].realm]:null;
  if(nb&&S.bag[nb]>0){takeItem(nb,1);used.push(ITEMS[nb].n)}
  if(!advance(big?6:2)) return;
  if(Math.random()<rate){
    S.lv++; S.exp=Math.max(0,S.exp-need*0.5);
    const nl=LV[S.lv].life;
    if(nl>S.lifeMax){S.lifeLeft+=(nl-S.lifeMax);S.lifeMax=nl}
    S.demon=Math.max(0,S.demon-(big?2:1));
    S.tena=0;
    if(S.lv>S.best)S.best=S.lv;
    log('【突破】步入 '+LV[S.lv].name+(big?'，寿元大涨！':''),'big');
    toast('突破成功：'+LV[S.lv].name,'big');
    if(S.lv>=MAXLV) ending();
  }else{
    S.exp=Math.max(0,S.exp-need*0.2);
    S.demon=Math.min(6,S.demon+1);
    S.tena=Math.min(0.3,(S.tena||0)+0.06);
    log('【失败】冲击 '+LV[S.lv+1].name+' 未成，气息紊乱','bad');
    toast('突破失败，心魔 +1','bad');
    if(Math.random()<0.5) hurt(1,'突破反噬');
  }
  afterAction();
}

function hurt(n,reason){
  S.injury=clamp(S.injury+n,0,3);
  const lose=rnd(2,8)*n;
  S.lifeLeft-=lose;
  toast((reason?reason+'，':'')+'寿元 -'+lose+' 年','bad');
  if(S.lifeLeft<=0){S.lifeLeft=0;die(reason||'重创而亡')}
}

function explore(zi){
  const z=ZONES[zi];
  if(S.lv<z.lv){toast('修为不足，此地凶险莫测','bad');return}
  if(!advance(3)) return;
  const dz=DZ[z.d];
  const mul={city:1.6,sect:0.55,evil:0.95,danger:1.3,secret:1.6}[z.kind]||1;
  const hn={city:rnd(0,1),sect:rnd(2,3),evil:rnd(1,2),danger:rnd(2,3),secret:rnd(2,4)}[z.kind];
  if(Math.random()<0.28){
    S.stone+=Math.round(rnd(dz.stone[0],dz.stone[1])*mul*0.6);
    for(let i=0;i<Math.max(0,hn-1);i++)addItem(pick(z.herbs),1);
    S.mind+=1;log('入'+z.n+'历练，寻得机缘','');
    afterEvent(z);afterAction();return;
  }
  const e=makeBeast(z);
  startBattle(e,(res,fled)=>{
    if(res==='win'){
      S.stone+=Math.round(rnd(dz.stone[0],dz.stone[1])*mul*(1+Math.random()*0.5));
      for(let i=0;i<hn;i++)addItem(pick(z.herbs),1);
      S.mind+=rnd(1,2);gainExp(needExp(S.lv)*rnd(4,8)/100);
      log('入'+z.n+'历练，斩妖除魔','good');toast('斩妖除魔，得灵石 '+fmt(S.stone),'good');
    }else if(fled){log('入'+z.n+'历练，不敌妖兽，遁走','bad')}
    else{log('入'+z.n+'历练，不敌妖兽，负伤而逃','bad');hurt(rnd(1,2),'妖兽')}
    afterEvent(z);afterAction();
  });
}
function afterEvent(z){
  if(z.kind==='city'){
    const mon=(S.months%12)+1;
    if(mon<=2){S.stone+=Math.round(rnd(200,600)*z.d);S.mind+=2;log('城中恰有仙师集会，颇有所得','good')}
    if(YIXIAN[z.k]===mon&&S.fortune<3) meetYixian();
  }
  if(Math.random()<0.42){
    const pool=EVENTS.filter(e=>S.lv>=e.min);
    if(pool.length){const e=pick(pool);log('【'+e.t+'】'+e.txt,e.c);e.fn();toast(e.t,e.c==='bad'?'bad':'big')}
  }
}

const SECT_MATES={zhushan:['liqinglin','mingshan'],jinhong:['xiaoqianjue','lingwuzhenren'],
  xinghe:['murongying','yunji'],lihuo:['yanxiao','henghuo'],huachen:['dantaixian']};
function joinSect(k){

/* ---------------- 人物交往 ---------------- */
function npcAct(k,act){
  const n=NPCS.find(x=>x.k===k);if(!n)return;
  const lk=like(k);
  if(act==='lun'){
    if(!advance(2))return;
    const g=Math.max(1,Math.round(n.lv/6))+(Math.random()<0.4?1:0);
    S.mind+=g;if(Math.random()<0.5&&S.demon>0)S.demon--;
    addLike(k,2);
    log('与'+n.n+'论道两月，神识 +'+g,'good');toast('神识 +'+g,'good');
  }else if(act==='qie'){
    if(!advance(1))return;
    const e=makeNpcEnemy(n);
    startBattle(e,(res,fled)=>{
      if(res==='win'){addLike(k,5);const st=Math.round(e.maxHp*0.4);S.stone+=st;log('与'+n.n+'切磋，胜。得灵石 '+fmt(st),'good');toast('胜 · 灵石 +'+fmt(st),'good')}
      else if(fled){addLike(k,1);log('与'+n.n+'切磋，不敌而退。','bad')}
      else{addLike(k,1);hurt(1,n.n+'手下')}
      afterAction();
    });
    return;
  }else if(act==='zeng'){
    const cost=50+Math.round(lk*2);
    if(S.stone<cost){toast('灵石不足','bad');return}
    S.stone-=cost;const g=rnd(6,12);addLike(k,g);
    if(!advance(1))return;
    log('赠'+n.n+'一份厚礼，花去 '+fmt(cost)+' 灵石，好感 +'+g,'good');toast('好感 +'+g,'good');
  }else if(act==='qing'){
    if(lk<60){toast('交情尚浅（需好感 60）','bad');return}
    if(!advance(3))return;
    const e=needExp(S.lv)*(0.15+Math.random()*0.2);
    gainExp(e);addLike(k,3);
    if(Math.random()<0.35&&n.lv>=16)addItem(pick(['h5','h6','h7','h8','h9']),1);
    log('得'+n.n+'指点三月，修为 +'+fmt(e),'good');toast('修为 +'+fmt(e),'good');
  }
  afterAction();
}

 const el=z.el||pick(ELS);
 const e={kind:'beast',name:beastName(z),n:beastName(z),el,lv:Math.max(1,S.lv+rnd(-1,2)),
  maxHp:0,hp:0,qi:{},w:elWeight(el),shield:0,armor:0,armorT:0,vuln:0,vulnT:0,burn:0,reflect:0,frozen:0,atkMul:1,atk:enemyAtk(el,S.lv),_t:0};
 e.maxHp=e.hp=Math.round(34*Math.pow(1.27,e.lv))+e.lv*10;
 if(S.wp&&WP_FX[S.wp])e.reflect=WP_FX[S.wp].reflect||0;
 return e;
}
function makeNpcEnemy(n){
 const el=NPC_EL[n.k]||pick(ELS);
 const e={kind:'npc',name:n.n,n:n.n,el,lv:n.lv,
  maxHp:0,hp:0,qi:{},w:elWeight(el),shield:0,armor:0,armorT:0,vuln:0,vulnT:0,burn:0,reflect:0,frozen:0,atkMul:1,atk:enemyAtk(el,n.lv),_t:0};
 e.maxHp=e.hp=Math.round(40*Math.pow(1.27,n.lv))+n.lv*10;
 if(S.wp&&WP_FX[S.wp])e.reflect=WP_FX[S.wp].reflect||0;
 return e;
}

function startBattle(e,done){
 const me={name:S.name,lv:S.lv,el:S.roots[0],
  maxHp:Math.round(40*Math.pow(1.27,S.lv)*(S.brHpMul||1))+S.mind*2+(S.hpBonus||0),hp:0,qi:{},w:playerWeights(),
  shield:0,armor:0,armorT:0,vuln:0,vulnT:0,burn:0,reflect:0,cd:{},lastEl:null,frozen:0,atkMul:1,xued:false,usedOnce:{}};
 me.hp=me.maxHp;
 if(S.wp&&WP_FX[S.wp]){const fx=WP_FX[S.wp];if(fx.shield)me.shield+=fx.shield;if(fx.reduce){me.armor=Math.max(me.armor,fx.reduce);me.armorT=99}if(fx.reflect)me.reflect=fx.reflect;}
 e.dun=e.lv+rnd(-1,2);
 B={enemy:e,me,done,over:false,turn:'me',log:[],round:1,showItems:false};
 drawQi(me,6);drawQi(e,4);
 const ps=playerDun(),es=e.dun;
 logB('【'+(e.name)+'】'+(e.kind==='npc'?'邀你切磋':'拦路而来')+'！（'+(ps>=es?'你遁速占先':'对手遁速占先')+'）','big');
 openBattle();
 if(ps<es-1){enemyTurn();if(!B||B.over)return;renderBattle();}else renderBattle();
}
function openBattle(){$('#battle').classList.remove('hidden')}
function closeBattle(){const el=$('#battle');if(el)el.classList.add('hidden');B=null}

function applyEffCard(eff,dst,src,boost,dmg){
 if(!eff)return;
 switch(eff){
  case 'heal': src.hp=Math.min(src.maxHp,src.hp+Math.round(src.maxHp*0.12));break;
  case 'heal2': src.hp=Math.min(src.maxHp,src.hp+Math.round(src.maxHp*0.25));src.shield+=Math.round(src.maxHp*0.15);break;
  case 'shield': src.shield+=Math.round(src.maxHp*0.12);break;
  case 'shield2': src.shield+=Math.round(src.maxHp*0.22);break;
  case 'armor': case 'reduce': src.armor=Math.max(src.armor,0.15);src.armorT=2;break;
  case 'burn': dst.burn+=2+boost;break;
  case 'vuln': dst.vuln=Math.max(dst.vuln,0.2);dst.vulnT=2;break;
  case 'burnvuln': dst.burn+=2;dst.vuln=Math.max(dst.vuln,0.2);dst.vulnT=2;break;
  case 'freeze': dst.frozen=1;break;
  case 'entangle': dst.vuln=Math.max(dst.vuln,0.2);dst.vulnT=2;dst.atkMul=0.6;break;
  case 'drain': src.hp=Math.min(src.maxHp,src.hp+Math.round((dmg||0)*0.4));break;
 }
}
function applyCard(src,dst,card,lastEl){
 if(card.eff==='qi'){drawQi(src,3);return src.name+' 凝神聚气，灵气大涨'}
 let combo=false;
 if(card.el&&lastEl&&SHENG[lastEl]===card.el)combo=true;
 let dmg=card.pow*Math.pow(1.27,src.lv||0);
 if(card.el&&dst.el)dmg*=keMul(card.el,dst.el);
 if(combo)dmg*=1.5;
 dmg*=(1-(dst.armor||0))*(1+(dst.vuln||0));
 if(dst.shield>0&&!card.pierce){const a=Math.min(dst.shield,Math.max(1,Math.round(dmg)));dst.shield-=a;dmg-=a;}
 dmg=Math.max(1,Math.round(dmg));
 dst.hp-=dmg;
 let extra='';
 if(dst.reflect&&dmg>0){const r=Math.round(dmg*dst.reflect);src.hp-=r;if(r>0)extra='，反伤 '+r}
 let t=src.name+' 施「'+card.n+(combo?'·连击':(card.el&&card.el!=='tong'?'·'+ELN[card.el]+'系':card.el==='tong'?'·同气':''))+'」伤 '+dst.name+' '+dmg+extra;
 applyEffCard(card.eff,dst,src,combo?1:0,dmg);
 return t;
}
function enemyTurn(){
 const e=B.enemy;e._t++;
 if(e.frozen>0){e.frozen--;logB(e.name+' 被【冻结】，无法行动！','');if(B.me.hp<=0)bLose();return;}
 if(S.tong&&Math.random()<S.tong){logB('【天生异瞳】'+e.name+' 神通落空！','big');if(B.me.hp<=0)bLose();return;}
 drawQi(e,2);
 const atk=e.atk,strong=(e._t%3===0);
 const card={n:e.name+' 灵术',el:atk.el,qi:0,pow:(strong?atk.pow*1.6:atk.pow)*(e.atkMul||1),eff:atk.eff};
 logB(applyCard(e,B.me,card,null),'bad');
 if(B.me.hp<=0)bLose();
}
function upkeep(){
 B.round++;
 for(const kk in B.me.cd){B.me.cd[kk]--;if(B.me.cd[kk]<=0)delete B.me.cd[kk];}
 [B.me,B.enemy].forEach(x=>{
  if(x.burn>0){const d=Math.round(x.burn*(1+0.06*x.lv));x.hp-=d;logB('【灼烧】'+(x===B.me?'你':x.name)+' 受 '+d+' 伤',x===B.me?'bad':'');x.burn--;}
  if(x.armorT>0){x.armorT--;if(x.armorT<=0)x.armor=0;}
  if(x.vulnT>0){x.vulnT--;if(x.vulnT<=0)x.vuln=0;}
 });
 if(S.regen&&B.me.hp>0&&B.me.hp<B.me.maxHp){const r=Math.round(B.me.maxHp*S.regen);B.me.hp=Math.min(B.me.maxHp,B.me.hp+r);logB('【龙族血脉】回血 '+r,'big');}
 drawQi(B.me,3);drawQi(B.enemy,2);B.me.lastEl=null;
 if(B.me.hp<=0)bLose();else if(B.enemy.hp<=0)bWin();
}
function bWin(){endBattle('win');}
function bLose(){endBattle('lose',false);}
function bFlee(){if(!B||B.over||B.turn!=='me')return;if(B.me.dun>=B.enemy.dun){endBattle('lose',true);return;}logB('遁速不济，未能遁走！','bad');B.turn='enemy';renderBattle();enemyTurn();if(!B||B.over)return;upkeep();if(!B||B.over)return;B.turn='me';renderBattle();}
function castXue(){if(!B||B.over||B.turn!=='me')return;if(B.me.xued){toast('血遁本场已用','bad');return;}if(!(S.dun&&S.dun.d_xue))return;const loss=Math.max(1,Math.round(B.me.hp*0.2));B.me.hp-=loss;B.me.xued=true;logB('你施展【血遁】，损耗 '+loss+' 气血，血光中遁走！','big');if(B.me.hp<=0){bLose();return;}endBattle('lose',true);}
function endBattle(res,fled){if(!B||B.over)return;B.over=true;const cb=B.done;closeBattle();if(cb)cb(res,fled);}

function castCard(k){
 if(!B||B.over||B.turn!=='me')return;
 const c=cardDef(k),el=cardEl(k);
 if(c.once&&B.me.usedOnce[k]){toast('本场已施展过','bad');return}
 if((c.cd||0)>0&&(B.me.cd[k]||0)>0){toast('尚在冷却','bad');return}
 if(c.qi>0&&(B.me.qi[el]||0)<c.qi){toast('灵气不足','bad');return}
 if(c.qi>0)B.me.qi[el]-=c.qi;
 if(c.cd)B.me.cd[k]=c.cd+1;
 if(c.once)B.me.usedOnce[k]=true;
 const combo=(c.el&&B.me.lastEl&&SHENG[B.me.lastEl]===c.el);
 logB(applyCard(B.me,B.enemy,{n:c.n,el:c.el,qi:c.qi,pow:c.pow,eff:c.eff,pierce:c.pierce},B.me.lastEl),combo?'big':'');
 B.me.lastEl=cardEl(k);
 if(B.enemy.hp<=0){renderBattle();bWin();return;}
 B.turn='enemy';renderBattle();
 enemyTurn();
 if(!B||B.over)return;
 upkeep();
 if(!B||B.over)return;
 B.turn='me';renderBattle();
}

function hpBar(x){const pct=clamp(x.hp/x.maxHp*100,0,100);return '<div class="bar life'+(x.hp/x.maxHp<0.3?' low':'')+'"><i style="width:'+pct+'%"></i></div><div class="hpt">'+Math.max(0,Math.round(x.hp))+' / '+x.maxHp+(x.shield>0?'　盾'+Math.round(x.shield):'')+'</div>'}
function statusStr(x){let s=[];if(x.burn>0)s.push('<span class="st burn">灼烧'+x.burn+'</span>');if(x.vuln>0)s.push('<span class="st vuln">易伤</span>');if(x.armor>0)s.push('<span class="st armor">减伤</span>');if(x.frozen>0)s.push('<span class="st freeze">冻结</span>');return s.join('')}
function enemyPanel(e){return '<div class="side-h"><b>'+e.name+'</b>'+(e.el?'<span class="el-tag" style="color:'+ELC[e.el]+'">'+ELN[e.el]+'系</span>':'')+'<span class="muted" style="margin-left:auto">第 '+B.round+' 合</span></div>'+hpBar(e)+'<div class="st-row">'+statusStr(e)+'</div>'}
function mePanel(m){let h='<div class="side-h"><b class="jade">'+m.name+'</b>'+(m.el?'<span class="el-tag" style="color:'+ELC[m.el]+'">主'+ELN[m.el]+'</span>':'')+'</div>'+hpBar(m)+'<div class="st-row">'+statusStr(m)+'</div><div class="qi-row">';QIELS.forEach(el=>{const v=m.qi[el]||0;const col=el==='tong'?'#b9b3c9':ELC[el];h+='<span class="qi'+(v>0?' on':'')+'" style="color:'+col+';border-color:'+col+'66">'+ELNS[el]+'<b>'+v+'</b></span>'});return h+'</div>'}
function renderBattle(){
 if(!B)return;const e=B.enemy,m=B.me;
 $('#b-enemy').innerHTML=enemyPanel(e);
 $('#b-log').innerHTML=B.log.slice(0,9).map(l=>'<div class="bl '+(l.cls||'')+'">'+l.t+'</div>').join('');
 $('#b-me').innerHTML=mePanel(m);
 const bc=$('#b-cards');
 if(B.showItems){renderItemsPanel(bc);return;}
 let cards=['sword','ning'].concat(Object.keys(S.arts)).concat(Object.keys(S.shen||{}));
 let ch='<div class="b-acts">';
 ch+='<button class="bact" onclick="B.showItems=true;renderBattle()">储物·丹药</button>';
 if(S.dun&&S.dun.d_xue&&!B.me.xued)ch+='<button class="bact xue" onclick="castXue()">血遁·舍命遁走</button>';
 ch+='</div>';
 cards.forEach(k=>{const c=cardDef(k),el=cardEl(k),onCd=(c.cd||0)>0&&(m.cd[k]||0)>0,usedOnce=c.once&&m.usedOnce[k],noQi=c.qi>0&&(m.qi[el]||0)<c.qi,dis=onCd||usedOnce||noQi||B.turn!=='me'||B.over;
  const tag=el?'<span style="color:'+(el==='tong'?'#b9b3c9':ELC[el])+'">'+ELNS[el]+'</span>'+c.qi:'—';
  const cls=(c.type==='shen'?' t-shen':'')+(el&&el!=='tong'?' el-'+el:'')+(dis?' dis':'');
  const lbl=usedOnce?' 已用':(onCd?' 冷却':(c.type==='shen'?' 神':''));
  ch+='<button class="bcard'+cls+'"'+(dis?' disabled':'')+' onclick="castCard(\''+k+'\')"><div class="bn">'+c.n+lbl+'</div><div class="bc">'+(c.eff?effHint(c.eff)+'　':'')+'耗 '+tag+'</div></button>';});
 ch+='<button class="bcard flee" onclick="bFlee()">遁 走</button>';
 bc.innerHTML=ch;
}
function renderItemsPanel(bc){
 const usable=['p_yuan','p_qi','p_xu'].filter(k=>count(k)>0);
 let h='<div class="bitem-hd">储物 · 临阵用丹</div>';
 if(!usable.length)h+='<div class="muted" style="padding:10px 4px">囊中无可用丹药。突破丹、延寿丹宜战外服用。</div>';
 usable.forEach(k=>{const it=ITEMS[k];h+='<button class="bcard" onclick="useBattlePill(\''+k+'\')"><div class="bn">'+it.n+'</div><div class="bc">'+it.d+'</div></button>'});
 h+='<button class="bcard flee" onclick="B.showItems=false;renderBattle()">返 回</button>';
 bc.innerHTML=h;
}
function useBattlePill(k){
 if(!B||B.over||B.turn!=='me'||B.showItems===false)return;
 if(count(k)<=0){B.showItems=false;renderBattle();return;}
 takeItem(k,1);B.showItems=false;
 let msg='';
 if(k==='p_yuan'){const h=Math.round(B.me.maxHp*0.4);B.me.hp=Math.min(B.me.maxHp,B.me.hp+h);msg='服下培元丹，恢复气血 '+h}
 else if(k==='p_qi'){drawQi(B.me,3);msg='服下凝气丹，灵气大涨'}
 else if(k==='p_xu'){B.me.hp=B.me.maxHp;B.me.shield+=Math.round(B.me.maxHp*0.3);msg='服下太虚还魂丹，气血充盈'}
 else {addItem(k,1);toast('此丹不宜临阵服用','bad');return;}
 logB(msg,'good');save();
 B.turn='enemy';renderBattle();enemyTurn();if(!B||B.over)return;upkeep();if(!B||B.over)return;B.turn='me';renderBattle();
}

/* ---------------- 主线剧情 ---------------- */
function storyOn(ch){
  if(S.story[ch.id])return false;
  if(ch.need&&!S.story[ch.need])return false;
  if(S.lv<ch.lv)return false;
  if(Math.floor(S.months/12)<ch.year)return false;
  return true;
}
function storyOpen(){return STORY.filter(storyOn)}
function applyEff(e){
  if(!e)return;
  if(e.exp)gainExp(needExp(S.lv)*e.exp);
  if(e.stone)S.stone=Math.max(0,S.stone+e.stone);
  if(e.item){
    const it=ITEMS[e.item];
    if(it.t==='wp'){S.wps[e.item]=1;if(!S.wp||(ITEMS[S.wp].atk||0)<(it.atk||0))S.wp=e.item}
    else if(it.t==='art'){S.arts[e.item]=1;S.art=e.item}
    else addItem(e.item,1);
  }
  if(e.pill)addItem(e.pill,1);
  if(e.herb)e.herb.forEach(k=>addItem(k,1));
  if(e.sect){const s=SECTS.find(x=>x.k===e.sect);if(s){S.sect=e.sect;S.arts[s.art]=1;S.art=s.art}}
  if(e.flag)S.flags[e.flag]=1;
  if(e.like)for(const k in e.like)addLike(k,e.like[k]);
  if(e.mind)S.mind+=e.mind;
  if(e.life)S.lifeLeft+=e.life;
  if(e.injury){S.injury=clamp(S.injury+e.injury,0,3);if(e.injury>0){const ls=rnd(2,8)*e.injury;S.lifeLeft-=ls;toast('寿元 -'+ls+' 年','bad')}}
  if(e.demon)S.demon=clamp(S.demon+e.demon,0,6);
}
function doStory(id,oi){
  const ch=STORY.find(x=>x.id===id);if(!ch||S.story[id])return;
  const o=ch.opts[oi];if(!o)return;
  const oldLv=S.lv,oldLife=S.lifeLeft,oldStone=S.stone;
  applyEff(o.e);
  S.story[id]={o:oi,r:o.r};
  log('【'+ch.t+'】'+o.r,'big');
  const diff=[];
  if(S.stone!==oldStone)diff.push('灵石 '+(S.stone>oldStone?'+':'')+fmt(S.stone-oldStone));
  if(Math.abs(S.lifeLeft-oldLife)>=1)diff.push('寿元 '+((S.lifeLeft-oldLife)>0?'+':'')+Math.round(S.lifeLeft-oldLife)+' 年');
  if(diff.length)log('　'+diff.join('　'),'');
  closeModal();afterAction();
}
function showStory(id){
  const ch=STORY.find(x=>x.id===id);if(!ch)return;
  let h='<p>'+ch.txt+'</p>';
  ch.opts.forEach((o,i)=>{
    const lack=o.need&&!count(o.need);
    h+='<button class="btn '+(lack?'ghost':'')+'" '+(lack?'disabled':'')+' onclick="doStory(\''+id+'\','+i+')">'+
       o.t+(lack?'（需'+ITEMS[o.need].n+'）':'')+'</button>';
  });
  showModal(ch.t,h,[{t:'再想想',f:'closeModal()',c:'ghost'}]);
}

function refine(rk){
  const r=RECIPES[rk];
  if(!S.recipes[rk]){toast('尚未习得此丹方','bad');return}
  for(const k in r.need){if(count(k)<r.need[k]){toast('药材不足：'+ITEMS[k].n,'bad');return}}
  if(!advance(2)) return;
  for(const k in r.need) takeItem(k,r.need[k]);
  const skill=S.refine*0.02+S.mind*0.01;
  const rate=clamp(0.62+skill-r.diff*0.07,0.15,0.95);
  if(Math.random()<rate){
    addItem(r.out,1);S.refine++;
    log('开炉炼丹，成！得 '+ITEMS[r.out].n,'good');toast('炼成 '+ITEMS[r.out].n,'good');
  }else{
    S.refine+=0.5;
    log('丹炉炸裂，药材尽毁','bad');toast('炼丹失败','bad');
  }
  afterAction();
}

function usePill(k){
  if(count(k)<=0)return;
  if(S.noPill&&k==='p_qi'){toast('先天异脉，服丹无所得','bad');addItem(k,1);return;}
  takeItem(k,1);
  switch(k){
    case 'p_qi':gainExp(needExp(S.lv)*0.3);toast('修为 +'+fmt(needExp(S.lv)*0.3),'good');log('服下凝气丹，修为暴涨','good');break;
    case 'p_yuan':S.injury=0;toast('伤势尽愈','good');log('服下培元丹，伤势尽愈','good');break;
    case 'p_qing':S.demon=Math.max(0,S.demon-2);toast('心魔 -2','good');log('服下清心丹，道心澄明','good');break;
    case 'p_shou':S.lifeLeft+=40;toast('寿元 +40 年','good');log('服下延寿丹，寿元 +40 年','good');break;
    case 'p_xu':S.lifeLeft+=200;S.injury=0;toast('寿元 +200 年','big');log('太虚还魂丹下肚，枯木回春','big');break;
    default:toast('此丹需突破时自动服用','bad');addItem(k,1);return;
  }
  afterAction();
}

function buy(k,price){
  if(S.stone<price){toast('灵石不足','bad');return}
  S.stone-=price;
  const it=ITEMS[k];
  if(it.t==='art'){S.arts[k]=1;S.art=k;toast('修习 '+it.n,'good');log('购得功法《'+it.n+'》','good')}
  else if(it.t==='shen'){S.shen[k]=1;toast('修习神通 '+it.n,'good');log('习得神通《'+it.n+'》','good')}
  else if(it.t==='dun'){S.dun[k]=1;toast('修习遁术 '+it.n,'good');log('习得遁术《'+it.n+'》','good')}
  else if(it.t==='wp'){S.wps[k]=1;if(!S.wp||(ITEMS[S.wp].atk||0)<(it.atk||0))S.wp=k;toast('获得 '+it.n,'good');log('购得法宝 '+it.n,'good')}
  else {addItem(k,1);toast('购入 '+it.n,'good')}
  afterAction();
}
function buyRecipe(rk){
  const r=RECIPES[rk];
  if(S.recipes[rk]){toast('已习得','bad');return}
  if(S.stone<r.v){toast('灵石不足','bad');return}
  S.stone-=r.v;S.recipes[rk]=1;
  toast('习得 '+r.n,'good');log('购得 '+r.n,'good');afterAction();
}
function sell(k,price){
  if(count(k)<=0)return;
  takeItem(k,1);S.stone+=price;
  toast('售出，+'+fmt(price)+' 灵石','good');afterAction();
}
function sellWp(k){
  if(!S.wps[k])return; delete S.wps[k]; if(S.wp===k)S.wp=null;
  S.stone+=Math.round(ITEMS[k].v*0.5);toast('售出 '+ITEMS[k].n,'good');afterAction();
}

function afterAction(){
  if(S.lifeLeft<=0){die('气息断绝');return}
  if(S.lv>S.best)S.best=S.lv;
  if(S.lifeLeft<10&&!S.warn){S.warn=1;toast('大限将至，速寻延寿之物','bad')}
  if(S.lifeLeft>=10)S.warn=0;
  const so=storyOpen().length;
  if(so>0&&so>(S.storyN||0))toast('有新的机缘（江湖 · 剧情）','big');
  S.storyN=so;
  save();paint();
}

/* ---------------- 生死 ---------------- */
function die(reason){
  const gainLegacy=Math.round(Math.pow(S.lv,1.35)+S.refine*0.3+S.mind*0.2);
  S.legacy+=gainLegacy;S.deaths++;
  log('【身死】'+S.name+' 于 '+ageStr(S.age)+' 之年'+reason+'，一代修士就此落幕。','bad');
  save();
  showModal('身死道消','<p style="text-align:center;color:#e0604f;letter-spacing:2px">'+reason+'</p>'+

function reborn(){
  const lg=S.legacy,best=S.best,bn=S.bestName,deaths=S.deaths;
  const g=S.gender,nm=S.name;
  S=newState();
  S.legacy=lg;S.best=best;S.bestName=bn;S.deaths=deaths;S.gender=g;S.name=nm;
  rollRoot();                       // 转世重洗灵根与资质（含传承加成）
  S.stone=200+lg*30;
  S.log=[{t:'【转世】'+nm+' 带着 '+lg+' 点传承重入轮回，此生资质 '+S.apt,c:'big'}];
  closeModal();save();paint();
  toast('转世成功','big');
}
function ending(){
  save();

    '<p class="muted">觅得长生，此局终了。你可继续游玩，或重开一世。</p>',
    [{t:'继续修行',f:'closeModal()'},{t:'重开一世',f:'hardReset()'}]);
}

/* ---------------- 界面 ---------------- */
let TAB='home',SHOPTAB='herb',PILLTAB='make',SECTCAT=0,SECTOPEN=null,SECTQ='',JHTAB='story';

const XING=['云','清','玄','寒','墨','白','离','青','紫','凌','夜','慕','楚','沈','姜','洛','秦','顾','宋','谢'];
const MING=['无涯','长风','子期','归尘','知非','寒山','明远','砚舟','惊鸿','孤鸿','九霄','听雪','知微','拂衣','清都','忘机','疏影','沉璧','问玄','抱朴'];
function randName(){return pick(XING)+pick(MING)}

function rollRoot(){
  const r=Math.random();let cnt,type,c;
  if(r<0.04){cnt=1;type='天灵根';c=1.65}
  else if(r<0.13){cnt=2;type='变异灵根';c=1.42}
  else if(r<0.34){cnt=2;type='双灵根';c=1.24}
  else if(r<0.60){cnt=3;type='三灵根';c=1.02}
  else if(r<0.84){cnt=4;type='四灵根';c=0.86}
  else{cnt=5;type='五灵根';c=0.70}
  const pool=ELS.slice(),roots=[];
  for(let i=0;i<cnt;i++)roots.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  S.roots=roots;S.rootType=type;S.rootC=c;
  S.apt=clamp(Math.round(rnd(46,90)+(6-cnt)*6+S.legacy*0.25),40,100);
}
function startGame(){
  if(remainPts()<0){toast('天赋点不足，请取舍','bad');return;}
  const n=$('#in-name').value.trim();
  S.name=n||randName();
  S.diff=C.diff;S.aotian=C.aotian;S.soul=C.soul;S.birth=C.birth;S.phys=C.phys;S.child=C.child;S.youth=C.youth;
  applyCreate();
  S.log=[{t:'【入道】'+S.name+'，'+S.rootType+'（'+S.roots.map(e=>ELN[e]).join('')+'），十六岁离家寻仙，自此踏上仙途。',c:'big'}];
  $('#screen-create').classList.add('hidden');
  $('#screen-main').classList.remove('hidden');
  save();paint();
  toast('仙途已启','big');
}

function paintHUD(){
  const need=needExp(S.lv);
  $('#h-name').textContent=S.name;
  $('#h-realm').textContent=realmName(S.lv);
  $('#h-age').textContent=ageStr(S.age);
  $('#h-exp-t').textContent=fmt(S.exp)+'/'+fmt(need);
  $('#h-exp').style.width=clamp(S.exp/need*100,0,100)+'%';
  $('#h-life-t').textContent=S.lifeLeft.toFixed(1)+'/'+S.lifeMax;
  $('#h-life').style.width=clamp(S.lifeLeft/S.lifeMax*100,0,100)+'%';
  $('#h-life-bar').classList.toggle('low',S.lifeLeft<Math.max(15,S.lifeMax*0.12));
  $('#h-stone').textContent=fmt(S.stone);
  $('#h-atk').textContent=fmt(power());
  $('#h-mind').textContent=S.mind;
  $('#h-legacy').textContent=S.legacy;
}
function paint(keep){
  if(!S)return;
  const v=$('#view'),st=v.scrollTop;
  paintHUD();renderView();
  if(keep!==false)v.scrollTop=st;   // 连续操作时保持阅读位置
}
function go(t){TAB=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));renderView();$('#view').scrollTop=0}

function renderView(){
  const v=$('#view');
  v.innerHTML= TAB==='home'?viewHome():TAB==='train'?viewTrain():TAB==='pill'?viewPill():TAB==='shop'?viewShop():TAB==='dex'?viewDex():TAB==='jh'?viewJianghu():viewMore();
}

  const ok=S.lv<MAXLV&&S.exp>=need;
  let h='';
  h+='<div class="card"><div class="ttl">道体</div>'+
    '<div class="row"><span class="k">境界</span><span class="v jade">'+realmName(S.lv)+'</span></div>'+
    '<div class="row"><span class="k">修为</span><span class="v">'+fmt(S.exp)+' / '+fmt(need)+'</span></div>'+
    '<div class="bar exp" style="margin:2px 0 10px"><i style="width:'+clamp(S.exp/need*100,0,100)+'%"></i></div>'+

  h+='<div class="card"><div class="ttl">行功</div><div class="grid2">'+
    '<button class="btn sm" onclick="cultivate(1)">打坐 一月</button>'+
    '<button class="btn sm" onclick="cultivate(6)">打坐 半年</button>'+
    '<button class="btn sm" onclick="cultivate(12)">打坐 一年</button>'+
    '<button class="btn sm" onclick="cultivate(36)">闭关 三年</button>'+
    '<button class="btn sm jade" style="grid-column:span 2" onclick="cultivate(120)">死关 十年（易生心魔）</button>'+

    '</div></div>';

  h+='<div class="card"><div class="ttl">破境</div>'+
    (S.lv<MAXLV?
      '<div class="row"><span class="k">下一境</span><span class="v">'+next+(isBigStep(S.lv)?' <span class="red">（大境界）</span>':'')+'</span></div>'+
      '<div class="row"><span class="k">所需修为</span><span class="v '+(ok?'jade':'')+'">'+fmt(S.exp)+' / '+fmt(need)+'</span></div>'+
      '<div class="row"><span class="k">成功率</span><span class="v '+(rate>0.7?'jade':rate>0.4?'gold':'red')+'">'+(rate*100).toFixed(0)+'%</span></div>'+

      :'<div class="muted">已臻金仙道果，与天同寿。</div>')+

    h+='<div class="card"><div class="ttl">机缘</div>'+
      opening.map(ch=>'<div class="item-row"><span><b class="gold">'+ch.t+'</b></span>'+

      '</div>';

  const pills=Object.keys(S.bag).filter(k=>ITEMS[k]&&ITEMS[k].t==='pill');

}

function viewTrain(){
  const p=power();

  let last='';
  ZONES.forEach((z,i)=>{
    if(z.area!==last){last=z.area;h+='<div class="ttl" style="margin:14px 0 8px">'+z.area+'</div>'}
    const lock=S.lv<z.lv,bp=DZ[z.d].bp,ratio=p/bp;

function viewPill(){

        '<button class="btn sm '+(can?'jade':'ghost')+'" '+(can?'':'disabled')+' onclick="refine(\''+rk+'\')">'+(can?'开炉（二月）':'药材不足')+'</button></div>';
    });
    h+='<div class="card"><div class="ttl">丹道</div><div class="row"><span class="k">炼丹造诣</span><span class="v">'+(S.refine|0)+' 炉</span></div>'+
      '<div class="muted">每成一丹，造诣 +1，成算随之提升；神识越深，火候越稳。</div></div>';
  }else{
    const ps=Object.keys(S.bag).filter(k=>ITEMS[k]&&ITEMS[k].t==='pill');
    if(!ps.length)h+='<div class="card"><div class="muted">囊中无丹。可自行炼制，或往坊市求购。</div></div>';
    ps.forEach(k=>{const it=ITEMS[k];
      const auto=(k==='p_zhu'||k==='p_jin'||k==='p_ying'||k==='p_shen'||k==='p_zhang');
      h+='<div class="card tight"><div class="row"><b class="gold">'+it.n+'</b><span class="v">×'+S.bag[k]+'</span></div>'+

             :'<button class="btn sm jade" onclick="usePill(\''+k+'\')">服 用</button>')+'</div>';

function sectList(){
  if(!SECTQ)return SECTDEX.c[SECTCAT].s;
  const q=SECTQ.trim();
  return SECTDEX.c[SECTCAT].s.map(s=>{
    const fs=s.f.filter(f=>f[0].indexOf(q)>=0||f[1].join('').indexOf(q)>=0||s.n.indexOf(q)>=0);
    return fs.length?{n:s.n,f:fs}:null;
  }).filter(Boolean);
}

    '<div class="row"><span class="k">神识</span><span class="v">'+S.mind+'</span></div>'+
    '<div class="row"><span class="k">门派</span><span class="v pur">'+(S.sect?((SECTS.find(x=>x.k===S.sect)||{}).n||'散修'):'散修')+'</span></div>'+
    '<div class="row"><span class="k">剧情</span><span class="v">'+Object.keys(S.story||{}).length+' / '+STORY.length+' 章</span></div>'+
    '</div>';

  const bName=(BIRTHS.find(x=>x.k===S.birth)||{}).n||'—',pName=(PHYSIQUE.find(x=>x.k===S.phys)||{}).n||'—',
    cName=(CHILDHOOD.find(x=>x.k===S.child)||{}).n||'—',yName=(YOUTH.find(x=>x.k===S.youth)||{}).n||'—',
    dName=(DIFFS.find(x=>x.k===S.diff)||{}).n||'普通';
  h+='<div class="card"><div class="ttl">出身根基</div>'+
    '<div class="row"><span class="k">道途</span><span class="v">'+dName+(S.aotian?' · 异世傲天':'')+(S.soul?' · 魂穿异世':'')+'</span></div>'+
    '<div class="row"><span class="k">身世</span><span class="v">'+bName+'</span></div>'+
    '<div class="row"><span class="k">先天体质</span><span class="v">'+pName+'</span></div>'+
    '<div class="row"><span class="k">儿时经历</span><span class="v">'+cName+'</span></div>'+
    '<div class="row"><span class="k">青年经历</span><span class="v">'+yName+'</span></div>'+
    '</div>';

  const bag=Object.keys(S.bag);
  const pills=bag.filter(k=>ITEMS[k]&&ITEMS[k].t==='pill');
  const others=bag.filter(k=>ITEMS[k]&&ITEMS[k].t!=='pill');
  h+='<div class="card"><div class="ttl">储物 · 丹药（可使用）</div>';
  if(!pills.length)h+='<div class="muted">尚无丹药。炼丹或坊市可求。</div>';
  else pills.forEach(k=>{const it=ITEMS[k];const auto=(k==='p_zhu'||k==='p_jin'||k==='p_ying'||k==='p_shen'||k==='p_zhang');
    h+='<div class="item-row"><div><b class="gold">'+it.n+'</b> ×'+S.bag[k]+'<div class="muted" style="font-size:11px">'+it.d+'</div></div>'+
      '<button class="btn sm '+(auto?'ghost':'jade')+'" style="width:auto;padding:8px 14px" onclick="usePill(\''+k+'\')">'+(auto?'突破时自动':'使用')+'</button></div>';});
  if(others.length||Object.keys(S.wps).length){
    h+='<div class="ttl" style="margin:12px 0 8px;font-size:13px;opacity:.8">杂物 · 法宝</div>';
    let s='';others.forEach(k=>{if(ITEMS[k])s+='<span class="chip">'+ITEMS[k].n+' ×'+S.bag[k]+'</span>'});
    Object.keys(S.wps).forEach(k=>s+='<span class="chip on">'+ITEMS[k].n+(S.wp===k?'（祭炼）':'')+'</span>');
    h+=s;
  }
  h+='</div>';

  h+='<div class="card"><div class="ttl">已习功法</div>';
  Object.keys(S.arts).forEach(k=>h+='<div class="item-row"><div><b class="gold">《'+ITEMS[k].n+'》</b></div>'+
    '<button class="btn sm '+(S.art===k?'ghost':'jade')+'" style="width:auto;padding:8px 14px" onclick="setArt(\''+k+'\')">'+(S.art===k?'主修中':'改修')+'</button></div>');
  h+='</div>';

  const shenKeys=Object.keys(S.shen||{});
  h+='<div class="card"><div class="ttl">神通（'+(shenKeys.length?('临阵可施 '+shenKeys.length+' 道'):'尚未习得')+'）</div>';
  if(!shenKeys.length)h+='<div class="muted">可往坊市「神通」购置，临阵耗灵气施展。</div>';
  else shenKeys.forEach(k=>{const it=ITEMS[k],f=SHEN[k];const elTxt=f.el==='tong'?'同气':(f.el?ELN[f.el]+'系':'通用');
    h+='<div class="item-row"><div><b class="pur">《'+it.n+'》</b><span class="muted"> '+elTxt+(f.once?' · 每场限一次':'')+'</span></div>'+
      '<span class="muted" style="font-size:11px">'+effHint(f.eff||'')+'　耗'+elTxt+f.qi+'灵气</span></div>';});
  h+='</div>';

  const dunKeys=Object.keys(S.dun||{});
  h+='<div class="card"><div class="ttl">遁术（遁速加成 '+(playerDun()-S.lv)+'）</div>';
  if(!dunKeys.length)h+='<div class="muted">可往坊市「遁术」购置，提升遁速利于先手与遁走。</div>';
  else dunKeys.forEach(k=>{const it=ITEMS[k];
    h+='<div class="item-row"><div><b class="pur">'+it.n+'</b></div>'+
      '<span class="muted" style="font-size:11px">'+(DUN[k].escape?'舍命遁走（每场一次）':'遁速 +'+(DUN[k].sp||0))+'</span></div>';});
  h+='</div>';

  h+='<div class="card"><div class="ttl">存档</div>'+
    '<div class="grid2">'+
    '<button class="btn sm ghost" onclick="exportSave()">导出</button>'+
    '<button class="btn sm ghost" onclick="importSave()">导入</button>'+
    '<button class="btn sm ghost" style="grid-column:span 2" onclick="confirmReset()">重开一世（清空全部）</button>'+
    '</div>'+
    '<div class="muted" style="margin-top:8px">进度自动保存在本机浏览器中，换设备请用导出／导入。</div></div>';

  h+='<div class="card"><div class="ttl">凡例</div>'+
    '<div class="muted" style="line-height:1.95">'+
    '· 一月一推，寿元随岁月流逝，耗尽则身死，转世重修，道行化传承。<br>'+
    '· 境界：练气→筑基→金丹→元婴→化神→炼虚→合体→大乘→渡劫→真仙，共十境。<br>'+
    '· 灵根与资质决定进境快慢，功法与福地可再加速。<br>'+
    '· 大境界突破凶险，宜备丹药；心魔越重，越易功败垂成。<br>'+
    '· 延寿丹、太虚还魂丹可续命，丹方在坊市。<br>'+
    '· 坊市「神通」「遁术」可购战斗神通与遁术：神通临阵耗五行/同气灵气施展，遁术增遁速以抢先手、利遁走；血遁可舍 20% 气血必遁。<br>'+
    '· 临阵点「储物·丹药」可用培元丹回血、凝气丹聚气；储物栏亦可直接使用丹药。<br><br>'+
    '<b class="gold">宁州风物</b><br>'+
    '· 五城：武陵城（倪家·白帝楼）、逸风城（宁王府）、云汐城（公孙家·风雨楼）、天星城（林家·星宫）、广陵城（百里家·龙族）。<br>'+
    '· 五派：竹山宗（木·方壶山）、金虹剑派（金·连石山）、星河剑派（水·风雷谷，只收女修）、离火门（火·沃焦山）、化尘教（土·正阳山）。<br>'+
    '· 邪魔外道：沂山派、禾山道（宁州）；血剑宫（雍州）、古神教（衡州）、天魔道（幽州）。<br>'+
    '· 一仙道人按月巡游五城客栈：正月武陵、三月逸风、六月云汐、八月天星、冬月广陵。三次算命之后，他会给你一块破碎玉佩。<br>'+
    '· 正月至二月城中办仙师集会；宁州大事按年推演：七年巫山魔影、三十年灿字牌、七十八年魔门入侵、百二十年涵虚仙府、五百年宁州古迹、七百五十年剑通碧落。'+
    '</div></div>';
  return h;
}

/* ---- 提示 / 弹窗 ---- */
function toast(t,c){
  const box=$('#toast'),d=document.createElement('div');
  d.className='tst '+(c||'');d.textContent=t;box.appendChild(d);
  if(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{d.style.transition='opacity .45s,transform .45s';d.style.opacity=0;d.style.transform='translateY(-8px)';setTimeout(()=>d.remove(),450)},1600);
}
function showModal(title,html,btns){
  closeModal();
  const m=document.createElement('div');m.id='modal';
  let bh='';(btns||[]).forEach(b=>bh+='<button class="btn '+(b.c||'')+'" onclick="'+b.f+'">'+b.t+'</button>');
  m.innerHTML='<div class="box"><h3>'+title+'</h3><div class="body">'+html+'</div>'+bh+'</div>';
  $('#app').appendChild(m);
}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function confirmReset(){
  showModal('重开一世','<p class="muted">将清空当前进度（含传承），回到开局。</p>',
    [{t:'确认重开',f:'hardReset()',c:'ghost'},{t:'再想想',f:'closeModal()'}]);
}
function hardReset(){
  try{localStorage.removeItem(SAVEKEY)}catch(e){}
  S=newState();closeModal();
  $('#screen-main').classList.add('hidden');
  $('#screen-create').classList.remove('hidden');
  $('#in-name').value='';C.diff='normal';C.aotian=false;C.soul=false;C.birth='farm';C.phys='mortal';C.child='free';C.youth='idle';C.cnt=1;C.main='jin';renderCreate();
}
function exportSave(){
  showModal('导出存档','<p class="muted">复制下方文本，可在其他设备导入续档。</p>'+
    '<textarea id="exp-t" style="width:100%;height:130px;background:rgba(0,0,0,.4);color:#a9a89f;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;font-family:monospace;outline:none">'+JSON.stringify(S)+'</textarea>',
    [{t:'复制文本',f:'copySave()'},{t:'关闭',f:'closeModal()',c:'ghost'}]);
}
function copySave(){
  const t=$('#exp-t');t.select();t.setSelectionRange(0,999999);
  try{document.execCommand('copy');toast('已复制','good')}catch(e){toast('请长按手动复制','bad')}
}
function importSave(){
  showModal('导入存档','<p class="muted">粘贴此前导出的存档文本。</p>'+
    '<textarea id="imp-t" placeholder="在此粘贴" style="width:100%;height:130px;background:rgba(0,0,0,.4);color:#a9a89f;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;font-family:monospace;outline:none"></textarea>',
    [{t:'导入并续档',f:'doImport()'},{t:'关闭',f:'closeModal()',c:'ghost'}]);
}
function doImport(){
  try{
    const o=JSON.parse($('#imp-t').value);
    S=Object.assign(newState(),o);
    S.shen=S.shen||{};S.dun=S.dun||{};
    closeModal();save();
    $('#screen-create').classList.add('hidden');
    $('#screen-main').classList.remove('hidden');
    paint();toast('导入成功','good');
  }catch(e){toast('存档文本有误','bad')}
}

/* ---- 启动 ---- */
(function init(){
  const sv=load();
  if(sv&&sv.name&&sv.lv!==undefined&&!sv.dead){
    S=Object.assign(newState(),sv);
    S.shen=S.shen||{};S.dun=S.dun||{};
    $('#screen-create').classList.add('hidden');
    $('#screen-main').classList.remove('hidden');
    paint();
  }else{
    S=newState();renderCreate();
  }
  $('#in-name').addEventListener('input',renderCreate);
})();
</script>
</body>
</html>
